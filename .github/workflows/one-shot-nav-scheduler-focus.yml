name: One-shot Navigation Scheduler Focus

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion-hardening-stage3'
    paths:
      - '.github/workflows/one-shot-nav-scheduler-focus.yml'

permissions:
  contents: read

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion-hardening-stage3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Electron dependencies
        run: npm ci
      - name: Repair Electron runtime and configure secure sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron() { node - <<'NODE'
          const fs=require('fs');try{const b=require('electron');if(typeof b==='string'&&fs.existsSync(b))process.stdout.write(b);else process.exit(1)}catch{process.exit(1)}
          NODE
          }
          install_electron(){ if [ -f node_modules/electron/install.js ]; then node node_modules/electron/install.js; else npm rebuild electron; fi; }
          ELECTRON_BIN="$(resolve_electron || true)"
          if [ -z "$ELECTRON_BIN" ]; then install_electron; ELECTRON_BIN="$(resolve_electron)"; fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then rm -rf "$ELECTRON_DIR"; install_electron; ELECTRON_BIN="$(resolve_electron)"; ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"; fi
          test -x "$ELECTRON_BIN"; test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"; sudo chmod 4755 "$SANDBOX"
          echo "ELECTRON_PATH=$ELECTRON_BIN" >> "$GITHUB_ENV"
      - name: Prove focus transfer fixes Enderloom tab lifecycle navigation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/enderloom-nav-focus.js <<'NODE'
          'use strict';
          const {app,BrowserWindow,WebContentsView,session}=require('electron');
          const http=require('http');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function waitFor(fn,timeout=1800){const end=Date.now()+timeout;while(Date.now()<end){if(fn())return true;await sleep(12)}return !!fn()}
          const safeHttpUrl=value=>{try{const u=new URL(String(value));return /^https?:$/.test(u.protocol)?u.toString():null}catch{return null}};
          function navHistoryStep(wc, offset) {
            const history=wc?.navigationHistory,step=Number(offset)||0;if(!step||!wc||wc.isDestroyed?.())return false;
            try {
              const index=history?.getActiveIndex?.(),entries=history?.getAllEntries?.()||[],target=Number(index)+step,targetUrl=String(entries[target]?.url||'');
              if(!Number.isInteger(index)||target<0||target>=entries.length||!targetUrl)return false;
              const committed=()=>{try{return wc.getURL()===targetUrl}catch{return false}};
              const loading=()=>{try{return !!(wc.isLoadingMainFrame?.()||wc.isLoading?.())}catch{return false}};
              const ensureCommit=()=>{
                if(wc.isDestroyed?.()||committed()||loading())return;
                try { if(history.getActiveIndex?.()===target)wc.reload(); else history.goToIndex(target); } catch {}
              };
              history.goToIndex(target);
              for(const delay of [350,900]){const timer=setTimeout(ensureCommit,delay);timer.unref?.()}
              return true;
            } catch { if(step<0&&wc?.canGoBack?.()){wc.goBack();return true} if(step>0&&wc?.canGoForward?.()){wc.goForward();return true} return false; }
          }
          function wireTab(view){
            let loading=false;
            view.webContents.setWindowOpenHandler(()=>({action:'deny'}));
            view.webContents.on('will-navigate',(event,targetUrl)=>{if(!safeHttpUrl(targetUrl))event.preventDefault()});
            view.webContents.on('did-start-loading',()=>{loading=true});
            view.webContents.on('did-stop-loading',()=>{loading=false});
            view.webContents.on('did-fail-load',(_e,code,_desc,_url,isMainFrame)=>{if(isMainFrame!==false&&Number(code)!==-3)loading=false});
            return ()=>loading;
          }
          app.whenReady().then(async()=>{
            const server=http.createServer((req,res)=>{
              res.setHeader('Content-Type','text/html; charset=utf-8');
              if(req.url.startsWith('/busy')){res.end('<!doctype html><title>busy</title><script>setInterval(()=>{const end=performance.now()+6;while(performance.now()<end){}},20)</script>busy');return}
              res.end(`<!doctype html><title>${req.url}</title><main>${req.url}</main>`);
            });
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const base=`http://127.0.0.1:${server.address().port}`,root=`${base}/`,two=`${base}/two`;
            const liveSession=session.fromPartition('persist:minecraft-catalog-live-focus');
            const win=new BrowserWindow({width:1000,height:700,show:true,webPreferences:{backgroundThrottling:false}});
            const makeTab=()=>new WebContentsView({webPreferences:{session:liveSession,nodeIntegration:false,contextIsolation:true,sandbox:true,webSecurity:true,backgroundThrottling:false}});
            const first=makeTab(),second=makeTab();wireTab(first);wireTab(second);
            first.setBounds({x:0,y:94,width:1000,height:606});second.setBounds({x:0,y:94,width:1000,height:606});
            first.setVisible(false);second.setVisible(false);win.contentView.addChildView(first);win.contentView.addChildView(second);
            const background=[];
            for(let i=0;i<4;i++){
              const view=new WebContentsView({webPreferences:{session:liveSession,nodeIntegration:false,contextIsolation:true,sandbox:true,webSecurity:true,backgroundThrottling:false}});
              background.push(view);await view.webContents.loadURL(`${base}/busy?slot=${i}`);
            }
            await first.webContents.loadURL(root);first.setVisible(true);first.webContents.focus();
            await second.webContents.loadURL(two);second.setVisible(false);
            const failures=[],latencies=[];
            for(let cycle=0;cycle<30;cycle++){
              first.setVisible(false);second.setVisible(true);second.webContents.focus();await sleep(24);
              second.setVisible(false);first.setVisible(true);
              // Candidate product fix: an actual tab/workspace activation transfers
              // keyboard/focus ownership to the newly visible WebContents before any
              // subsequent navigation. Layout-only operations do not call this path.
              first.webContents.focus();await sleep(12);
              if(first.webContents.getURL()!==two)await first.webContents.loadURL(two);
              const before={index:first.webContents.navigationHistory.getActiveIndex(),entries:first.webContents.navigationHistory.getAllEntries().map(x=>x.url)};
              const started=Date.now();navHistoryStep(first.webContents,-1);
              const ok=await waitFor(()=>first.webContents.getURL()===root,1800);latencies.push(Date.now()-started);
              const after={url:first.webContents.getURL(),index:first.webContents.navigationHistory.getActiveIndex(),entries:first.webContents.navigationHistory.getAllEntries().map(x=>x.url),isLoading:first.webContents.isLoading(),isLoadingMainFrame:first.webContents.isLoadingMainFrame?.()};
              if(!ok){failures.push({cycle,before,after});break}
              navHistoryStep(first.webContents,1);
              if(!await waitFor(()=>first.webContents.getURL()===two,1800)){failures.push({cycle,dir:'forward',url:first.webContents.getURL(),index:first.webContents.navigationHistory.getActiveIndex()});break}
            }
            const result={passed:failures.length===0,cycles:30,failures,maxMs:Math.max(...latencies),avgMs:Math.round(latencies.reduce((a,b)=>a+b,0)/Math.max(1,latencies.length))};
            console.log('ENDERLOOM_NAV_LIFECYCLE',JSON.stringify(result));
            for(const view of background){try{view.webContents.close()}catch{}};try{first.webContents.close()}catch{};try{second.webContents.close()}catch{};try{win.destroy()}catch{}
            await new Promise(resolve=>server.close(resolve));app.exit(result.passed?0:1);
          }).catch(error=>{console.error(error);app.exit(1)});
          NODE
          timeout 120s xvfb-run -a "$ELECTRON_PATH" /tmp/enderloom-nav-focus.js 2>&1 | tee nav-focus.log
          grep -q 'ENDERLOOM_NAV_LIFECYCLE {"passed":true' nav-focus.log
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-lifecycle-focus-${{ github.sha }}
          path: nav-focus.log
          if-no-files-found: warn
          retention-days: 7
