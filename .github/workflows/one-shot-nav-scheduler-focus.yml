name: One-shot Navigation Scheduler Focus

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion-hardening-stage3'
    paths:
      - '.github/workflows/one-shot-nav-scheduler-focus.yml'

permissions:
  contents: read

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion-hardening-stage3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Electron dependencies
        run: npm ci
      - name: Repair Electron runtime and configure secure sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron() { node - <<'NODE'
          const fs=require('fs');try{const b=require('electron');if(typeof b==='string'&&fs.existsSync(b))process.stdout.write(b);else process.exit(1)}catch{process.exit(1)}
          NODE
          }
          install_electron(){ if [ -f node_modules/electron/install.js ]; then node node_modules/electron/install.js; else npm rebuild electron; fi; }
          ELECTRON_BIN="$(resolve_electron || true)"
          if [ -z "$ELECTRON_BIN" ]; then install_electron; ELECTRON_BIN="$(resolve_electron)"; fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then rm -rf "$ELECTRON_DIR"; install_electron; ELECTRON_BIN="$(resolve_electron)"; ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"; fi
          test -x "$ELECTRON_BIN"; test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"; sudo chmod 4755 "$SANDBOX"
          echo "ELECTRON_PATH=$ELECTRON_BIN" >> "$GITHUB_ENV"
      - name: Stress history commits against hidden media renderer load
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/enderloom-nav-focus.js <<'NODE'
          'use strict';
          const {app,BrowserWindow,WebContentsView}=require('electron');
          const http=require('http');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function waitFor(fn,timeout=1800){const end=Date.now()+timeout;while(Date.now()<end){if(fn())return true;await sleep(12)}return !!fn()}
          function navHistoryStep(wc, offset) {
            const history=wc?.navigationHistory,step=Number(offset)||0;if(!step||!wc||wc.isDestroyed?.())return false;
            try {
              const index=history?.getActiveIndex?.(),entries=history?.getAllEntries?.()||[],target=Number(index)+step,targetUrl=String(entries[target]?.url||'');
              if(!Number.isInteger(index)||target<0||target>=entries.length||!targetUrl)return false;
              const committed=()=>{try{return wc.getURL()===targetUrl}catch{return false}};
              const loading=()=>{try{return !!(wc.isLoadingMainFrame?.()||wc.isLoading?.())}catch{return false}};
              const ensureCommit=()=>{
                if(wc.isDestroyed?.()||committed()||loading())return;
                try { if(history.getActiveIndex?.()===target)wc.reload(); else history.goToIndex(target); } catch {}
              };
              history.goToIndex(target);
              for(const delay of [350,900]){const timer=setTimeout(ensureCommit,delay);timer.unref?.()}
              return true;
            } catch { if(step<0&&wc?.canGoBack?.()){wc.goBack();return true} if(step>0&&wc?.canGoForward?.()){wc.goForward();return true} return false; }
          }
          async function runScenario(base,backgroundThrottling,label){
            const win=new BrowserWindow({width:1000,height:700,show:true,webPreferences:{backgroundThrottling:false}});
            const browser=new WebContentsView({webPreferences:{backgroundThrottling:false}});
            win.contentView.addChildView(browser);browser.setBounds({x:0,y:0,width:1000,height:700});
            const background=[];
            for(let i=0;i<4;i++){
              const view=new WebContentsView({webPreferences:{backgroundThrottling}});
              background.push(view);
              await view.webContents.loadURL(`${base}/busy?slot=${i}`);
            }
            const root=`${base}/`,two=`${base}/two`;
            await browser.webContents.loadURL(root);await browser.webContents.loadURL(two);
            const failures=[],latencies=[];
            for(let i=0;i<24;i++){
              const a=Date.now();navHistoryStep(browser.webContents,-1);
              if(!await waitFor(()=>browser.webContents.getURL()===root,1800))failures.push({cycle:i,dir:'back',url:browser.webContents.getURL(),index:browser.webContents.navigationHistory.getActiveIndex(),entries:browser.webContents.navigationHistory.getAllEntries().map(x=>x.url)});
              latencies.push(Date.now()-a);
              const b=Date.now();navHistoryStep(browser.webContents,1);
              if(!await waitFor(()=>browser.webContents.getURL()===two,1800))failures.push({cycle:i,dir:'forward',url:browser.webContents.getURL(),index:browser.webContents.navigationHistory.getActiveIndex(),entries:browser.webContents.navigationHistory.getAllEntries().map(x=>x.url)});
              latencies.push(Date.now()-b);
              if(failures.length)break;
            }
            for(const view of background){try{view.webContents.close()}catch{}}
            try{browser.webContents.close()}catch{};try{win.destroy()}catch{}
            const result={label,backgroundThrottling,passed:failures.length===0,failures,maxMs:Math.max(...latencies),avgMs:Math.round(latencies.reduce((a,b)=>a+b,0)/Math.max(1,latencies.length))};
            console.log('ENDERLOOM_NAV_FOCUS',JSON.stringify(result));
            return result;
          }
          app.whenReady().then(async()=>{
            const server=http.createServer((req,res)=>{
              res.setHeader('Content-Type','text/html; charset=utf-8');
              if(req.url.startsWith('/busy')){res.end('<!doctype html><title>busy</title><script>setInterval(()=>{const end=performance.now()+6;while(performance.now()<end){}},20)</script>busy');return}
              res.end(`<!doctype html><title>${req.url}</title><main>${req.url}</main>`);
            });
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const base=`http://127.0.0.1:${server.address().port}`;
            try{
              const unthrottled=await runScenario(base,false,'unthrottled-hidden-media');
              const throttled=await runScenario(base,true,'throttled-hidden-media');
              console.log('ENDERLOOM_NAV_FOCUS_SUMMARY',JSON.stringify({unthrottled,throttled}));
              if(!throttled.passed)process.exitCode=1;
            }finally{await new Promise(resolve=>server.close(resolve));app.quit()}
          }).catch(error=>{console.error(error);process.exitCode=1;app.quit()});
          NODE
          timeout 120s xvfb-run -a "$ELECTRON_PATH" /tmp/enderloom-nav-focus.js 2>&1 | tee nav-focus.log
          grep -q 'ENDERLOOM_NAV_FOCUS_SUMMARY' nav-focus.log
          grep -q '"label":"throttled-hidden-media","backgroundThrottling":true,"passed":true' nav-focus.log
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-scheduler-focus-${{ github.sha }}
          path: nav-focus.log
          if-no-files-found: warn
          retention-days: 7
