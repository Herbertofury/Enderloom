name: One-shot Media QoS And DOM Budget Hardening

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion-hardening-stage3'
    paths:
      - '.github/workflows/one-shot-gallery-dom-budget-hardening.yml'

permissions:
  contents: write

jobs:
  harden-and-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      ENDERLOOM_DISABLE_CREATOR_AUTO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion-hardening-stage3
          fetch-depth: 32

      - name: Verify unchanged source base and patch media QoS invariants
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2780deaf7c5d569846c2d8a7fe98e4118b614a37 HEAD
          test "$(git rev-parse HEAD:main.js)" = "$(git rev-parse 2780deaf7c5d569846c2d8a7fe98e4118b614a37:main.js)"
          python3 - <<'PY'
          from pathlib import Path

          p=Path('main.js')
          text=p.read_text(encoding='utf-8')

          def swap(old, new, label):
              global text
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text=text.replace(old,new,1)

          swap(
              "    const remaining=Math.max(250,limit-(Date.now()-started));\n    const guardedScript=`(async()=>{try{return {ok:true,value:await (${script})}}catch(error){return {ok:false,error:String(error?.stack||error)}}})()`;",
              "    const remaining=Math.max(250,limit-(Date.now()-started));\n    // Expose the real post-navigation execution budget to bounded renderer helpers.\n    // Callers may shorten internal settle loops from this value, but generic scripts\n    // remain unchanged. The value is restored so pooled WebContents never leak state.\n    const guardedScript=`(async()=>{const previousBudget=window.__ENDERLOOM_DOM_EXTRACT_BUDGET_MS__;window.__ENDERLOOM_DOM_EXTRACT_BUDGET_MS__=${remaining};try{return {ok:true,value:await (${script})}}catch(error){return {ok:false,error:String(error?.stack||error)}}finally{if(previousBudget===undefined)delete window.__ENDERLOOM_DOM_EXTRACT_BUDGET_MS__;else window.__ENDERLOOM_DOM_EXTRACT_BUDGET_MS__=previousBudget}})()`;",
              'renderer budget bridge',
          )

          swap(
              "const waitMs=Math.max(900,Math.min(4600,Number(timeoutMs)||5200)-450);",
              "const totalMs=Math.max(1800,Number(timeoutMs)||5200);\n  const requestedWaitMs=Math.max(700,Math.min(4200,totalMs-900));",
              'gallery total budget',
          )
          swap(
              "const script=String.raw`(async()=>{const deadline=Date.now()+${waitMs};let last=-1,stable=0;while(Date.now()<deadline){",
              "const script=String.raw`(async()=>{const liveBudget=Math.max(250,Number(window.__ENDERLOOM_DOM_EXTRACT_BUDGET_MS__)||(${requestedWaitMs}+450));const settleBudget=Math.max(50,Math.min(${requestedWaitMs},liveBudget-450));const deadline=Date.now()+settleBudget;let last=-1,stable=0;while(Date.now()<deadline){",
              'gallery post-navigation settle budget',
          )
          swap(
              "return extractLivePageMediaQuick(target,script,{timeoutMs:Math.max(1200,Number(timeoutMs)||5200),foreground});",
              "return extractLivePageMediaQuick(target,script,{timeoutMs:totalMs,foreground});",
              'gallery outer budget',
          )

          old_pump="\n".join([
              "function pumpMediaPrime() {",
              "  while(activeMediaPrimeJobs<mediaPrimeTarget&&mediaPrimeQueue.length){",
              "    const job=nextMediaPrimeJob();if(!job)break;activeMediaPrimeJobs++;",
              "    runMediaPrime(job).finally(()=>{activeMediaPrimeJobs--;pumpMediaPrime();});",
              "  }",
              "}",
          ])
          new_pump="\n".join([
              "const MEDIA_PRIME_URGENT_PRIORITY=900000;",
              "const MEDIA_PRIME_URGENT_BURST=1;",
              "function pumpMediaPrime() {",
              "  while(mediaPrimeQueue.length){",
              "    // One bounded visible/interactive burst prevents background jobs from",
              "    // monopolizing the adaptive frontier without creating unbounded concurrency.",
              "    const urgentQueued=mediaPrimeQueue.some(job=>(Number(job?.priority)||0)>=MEDIA_PRIME_URGENT_PRIORITY);",
              "    const activeLimit=Math.min(MEDIA_PRIME_MAX,mediaPrimeTarget+(urgentQueued?MEDIA_PRIME_URGENT_BURST:0));",
              "    if(activeMediaPrimeJobs>=activeLimit)break;",
              "    const job=nextMediaPrimeJob();if(!job)break;activeMediaPrimeJobs++;",
              "    runMediaPrime(job).finally(()=>{activeMediaPrimeJobs--;pumpMediaPrime();});",
              "  }",
              "}",
          ])
          swap(old_pump,new_pump,'urgent prime scheduler')

          swap(
              "extractCurseForgeGalleryDomQuick(galleryUrl,job.context,{timeoutMs:Number(job.priority)>=900000?4600:5200}).catch(()=>null)",
              "extractCurseForgeGalleryDomQuick(galleryUrl,job.context,{timeoutMs:Number(job.priority)>=900000?4600:5200,foreground:Number(job.priority)>=900000}).catch(()=>null)",
              'urgent gallery foreground hedge',
          )
          swap(
              "extractLivePageMediaQuick(url,contextScript,{timeoutMs:3000}).catch(()=>null)",
              "extractLivePageMediaQuick(url,contextScript,{timeoutMs:3000,foreground:Number(job.priority)>=900000}).catch(()=>null)",
              'urgent generic foreground hedge',
          )

          old_acquire="\n".join([
              "function acquireMediaView({ foreground=false } = {}) {",
              "  const normalLimit=Math.max(1,MEDIA_VIEW_POOL_MAX-MEDIA_VIEW_FOREGROUND_RESERVE);",
              "  const idle=mediaViewPool.find(x=>!x.busy&&(foreground||!x.foregroundOnly)&&x.view&&!x.view.webContents.isDestroyed());",
              "  if(idle){idle.busy=true;return Promise.resolve(idle.view)}",
              "  const limit=foreground?MEDIA_VIEW_POOL_MAX:normalLimit;",
              "  if(mediaViewPool.length<limit){const view=newMediaView();mediaViewPool.push({view,busy:true,foregroundOnly:foreground&&mediaViewPool.length>=normalLimit});return Promise.resolve(view)}",
              "  return new Promise(resolve=>{const waiter={resolve,foreground};foreground?mediaViewWaiters.unshift(waiter):mediaViewWaiters.push(waiter)});",
              "}",
          ])
          new_acquire="\n".join([
              "function acquireMediaView({ foreground=false } = {}) {",
              "  const normalLimit=Math.max(1,MEDIA_VIEW_POOL_MAX-MEDIA_VIEW_FOREGROUND_RESERVE);",
              "  const usable=x=>!x.busy&&x.view&&!x.view.webContents.isDestroyed();",
              "  // Foreground work consumes reserved views first; background work can never",
              "  // borrow them. A normal idle view remains a safe foreground fallback.",
              "  const idle=foreground",
              "    ? (mediaViewPool.find(x=>usable(x)&&x.foregroundOnly===true)||mediaViewPool.find(x=>usable(x)&&!x.foregroundOnly))",
              "    : mediaViewPool.find(x=>usable(x)&&!x.foregroundOnly);",
              "  if(idle){idle.busy=true;return Promise.resolve(idle.view)}",
              "  const normalCount=mediaViewPool.filter(x=>x.view&&!x.view.webContents.isDestroyed()&&!x.foregroundOnly).length;",
              "  const foregroundCount=mediaViewPool.filter(x=>x.view&&!x.view.webContents.isDestroyed()&&x.foregroundOnly===true).length;",
              "  const totalCount=normalCount+foregroundCount;",
              "  if(!foreground&&normalCount<normalLimit){const view=newMediaView();mediaViewPool.push({view,busy:true,foregroundOnly:false});return Promise.resolve(view)}",
              "  if(foreground&&totalCount<MEDIA_VIEW_POOL_MAX){",
              "    const foregroundOnly=foregroundCount<MEDIA_VIEW_FOREGROUND_RESERVE;",
              "    const view=newMediaView();mediaViewPool.push({view,busy:true,foregroundOnly});return Promise.resolve(view);",
              "  }",
              "  return new Promise(resolve=>{const waiter={resolve,foreground};foreground?mediaViewWaiters.unshift(waiter):mediaViewWaiters.push(waiter)});",
              "}",
          ])
          swap(old_acquire,new_acquire,'foreground pool acquire invariant')

          old_warm="\n".join([
              "function warmMediaViewPool(count=Math.min(4,MEDIA_VIEW_POOL_MAX)) {",
              "  const target=Math.max(0,Math.min(MEDIA_VIEW_POOL_MAX,Number(count)||0));",
              "  while(mediaViewPool.length<target){",
              "    const view=newMediaView();",
              "    mediaViewPool.push({view,busy:false,warmedAt:Date.now()});",
              "  }",
              "  return mediaViewPool.length;",
              "}",
          ])
          new_warm="\n".join([
              "function warmMediaViewPool(count=Math.min(4,MEDIA_VIEW_POOL_MAX)) {",
              "  const target=Math.max(0,Math.min(MEDIA_VIEW_POOL_MAX,Number(count)||0));",
              "  const reserveWarm=Math.min(MEDIA_VIEW_FOREGROUND_RESERVE,target);",
              "  const normalWarm=Math.max(0,target-reserveWarm);",
              "  let normalCount=mediaViewPool.filter(x=>x.view&&!x.view.webContents.isDestroyed()&&!x.foregroundOnly).length;",
              "  let foregroundCount=mediaViewPool.filter(x=>x.view&&!x.view.webContents.isDestroyed()&&x.foregroundOnly===true).length;",
              "  while(normalCount<normalWarm&&mediaViewPool.length<MEDIA_VIEW_POOL_MAX){",
              "    const view=newMediaView();mediaViewPool.push({view,busy:false,warmedAt:Date.now(),foregroundOnly:false});normalCount++;",
              "  }",
              "  while(foregroundCount<reserveWarm&&mediaViewPool.length<MEDIA_VIEW_POOL_MAX){",
              "    const view=newMediaView();mediaViewPool.push({view,busy:false,warmedAt:Date.now(),foregroundOnly:true});foregroundCount++;",
              "  }",
              "  return mediaViewPool.length;",
              "}",
          ])
          swap(old_warm,new_warm,'foreground pool warm invariant')

          p.write_text(text,encoding='utf-8')
          PY
          node --check main.js
          grep -q '__ENDERLOOM_DOM_EXTRACT_BUDGET_MS__' main.js
          grep -q 'settleBudget=Math.max(50,Math.min' main.js
          grep -q 'MEDIA_PRIME_URGENT_PRIORITY=900000' main.js
          grep -q 'foreground:Number(job.priority)>=900000' main.js
          grep -q 'reserveWarm=Math.min(MEDIA_VIEW_FOREGROUND_RESERVE,target)' main.js
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install and build real launcher boundary
        run: |
          npm ci
          npm ci --prefix launcher
          npm run build:integration
          test -f launcher/dist/index.html
          test -x native/target/debug/enderloom-service

      - name: Repair Electron runtime and configure secure sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron() { node - <<'NODE'
          const fs=require('fs');try{const b=require('electron');if(typeof b==='string'&&fs.existsSync(b))process.stdout.write(b);else process.exit(1)}catch{process.exit(1)}
          NODE
          }
          install_electron(){ if [ -f node_modules/electron/install.js ]; then node node_modules/electron/install.js; else npm rebuild electron; fi; }
          ELECTRON_BIN="$(resolve_electron || true)"
          if [ -z "$ELECTRON_BIN" ]; then install_electron; ELECTRON_BIN="$(resolve_electron)"; fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then rm -rf "$ELECTRON_DIR"; install_electron; ELECTRON_BIN="$(resolve_electron)"; ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"; fi
          test -x "$ELECTRON_BIN"; test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"; sudo chmod 4755 "$SANDBOX"
          echo "ELECTRON_PATH=$ELECTRON_BIN" >> "$GITHUB_ENV"

      - name: Repeat real Electron self-test three times
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            log="electron-self-test-$n.log"
            timeout 180s xvfb-run -a npm run electron-self-test 2>&1 | tee "$log"
            grep -q 'CATALOG_COMPANION_SELF_TEST {"passed":true' "$log"
            if grep -Eq 'main-process streaming media prime runtime: .*done.*false|MaxListenersExceededWarning|Live DOM hedge failed -3|Live DOM (hedge|extraction) timed out' "$log"; then
              echo "::error::Electron media QoS/lifecycle/budget regression on pass $n"
              exit 1
            fi
          done

      - name: Preserve repeated challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-qos-dom-budget-challenge-${{ github.sha }}
          path: electron-self-test-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit only proven source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Herbertofury'
          git config user.email 'stealth.sanchez@hotmail.com'
          rm .github/workflows/one-shot-gallery-dom-budget-hardening.yml
          git add main.js .github/workflows/one-shot-gallery-dom-budget-hardening.yml
          changed="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/one-shot-gallery-dom-budget-hardening.yml\nmain.js'
          test "$changed" = "$expected"
          git commit -m 'fix(media): guarantee urgent prime QoS with real DOM budgets'
          git push origin HEAD:feature/creator-vault-auto-ingestion-hardening-stage3
