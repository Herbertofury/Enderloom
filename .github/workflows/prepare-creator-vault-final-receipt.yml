name: Prepare Creator Vault Final Acceptance Receipt

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion'
    paths:
      - '.github/workflows/prepare-creator-vault-final-receipt.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion
          fetch-depth: 0
      - name: Harden final release with deterministic tag and durable receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/creator-vault-final-release.yml')
          s=p.read_text()
          s=s.replace('TAG="creator-vault-auto-v3-${GITHUB_RUN_NUMBER}"','TAG="creator-vault-auto-v3-final"')
          old="""  release:\n    needs: [acceptance, windows-package]\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/download-artifact@v4\n"""
          new="""  release:\n    needs: [acceptance, windows-package]\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: feature/creator-vault-auto-ingestion\n          fetch-depth: 0\n      - uses: actions/download-artifact@v4\n"""
          if old in s: s=s.replace(old,new,1)
          needle='''          gh release create "$TAG" release/Enderloom-Creator-Vault-Auto-v3-Windows-x64.zip release/Enderloom-Creator-Vault-Auto-v3-Windows-x64.zip.sha256 release/ACCEPTANCE.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Enderloom Creator Vault Automatic Ingestion v3" --notes "Fully gated Windows x64 prerelease for Creator Vault automatic creator ingestion. Built only after focused QA, existing Creator Vault + catalog regressions, portable render, Electron self-test, and real YouTube/TikTok/Modrinth outbound smoke passed." --prerelease\n'''
          replacement='''          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true\n          gh release create "$TAG" release/Enderloom-Creator-Vault-Auto-v3-Windows-x64.zip release/Enderloom-Creator-Vault-Auto-v3-Windows-x64.zip.sha256 release/ACCEPTANCE.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Enderloom Creator Vault Automatic Ingestion v3" --notes "Fully gated Windows x64 prerelease for Creator Vault automatic creator ingestion. Built only after focused QA, existing Creator Vault + catalog regressions, portable render, Electron self-test, and real YouTube/TikTok/Modrinth outbound smoke passed." --prerelease\n          mkdir -p docs\n          cat > docs/creator-vault-auto-v3-accepted.json <<JSON\n          {\n            "schemaVersion": 1,\n            "accepted": true,\n            "testedCommit": "${GITHUB_SHA}",\n            "acceptanceRunId": "${GITHUB_RUN_ID}",\n            "releaseTag": "${TAG}",\n            "gates": ["focused-stress-qa", "creator-vault-regression", "catalog-regression", "portable-render", "electron-self-test", "live-youtube", "live-tiktok", "live-modrinth", "windows-package"],\n            "artifact": "Enderloom-Creator-Vault-Auto-v3-Windows-x64.zip"\n          }\n          JSON\n          git config user.name github-actions[bot]\n          git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n          git add docs/creator-vault-auto-v3-accepted.json\n          git commit -m 'docs(creator-vault): record final automatic-ingestion acceptance'\n          git push origin HEAD:feature/creator-vault-auto-ingestion\n'''
          if needle not in s: raise SystemExit('final release command marker not found')
          s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/prepare-creator-vault-final-receipt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'ci(creator-vault): add deterministic final acceptance receipt'
          git push origin HEAD:feature/creator-vault-auto-ingestion
