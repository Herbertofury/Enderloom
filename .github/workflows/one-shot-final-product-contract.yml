name: One-shot Final Product Contract

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion-hardening-stage3'
    paths:
      - '.github/workflows/one-shot-final-product-contract.yml'

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      ENDERLOOM_DISABLE_CREATOR_AUTO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion-hardening-stage3
          fetch-depth: 256
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply proven candidate and strengthen launcher handoff product contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=2780deaf7c5d569846c2d8a7fe98e4118b614a37
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:main.js)" = "$(git rev-parse "$BASE":main.js)"
          test "$(git rev-parse HEAD:launcher-preload.js)" = "$(git rev-parse "$BASE":launcher-preload.js)"
          python3 - <<'PY'
          from pathlib import Path

          # Reuse the complete final candidate (media/QoS, exact gallery dual SSR,
          # force-vs-deep, abort containment, durable launcher events, history helper,
          # and the focused 30-cycle activation-focus fix) rather than forking it.
          workflow = Path('.github/workflows/one-shot-final-focus-acceptance.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          body = workflow[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          for token in ['focusActivatedView','launcher:event-subscribe','node-gallery-ssr-fast','setTimeout(()=>{try{controller.abort()}catch{}},timeoutMs']:
              if token not in workflow and token not in body:
                  raise SystemExit(f'final candidate missing invariant: {token}')
          exec(compile(body, 'reused-final-candidate.py', 'exec'), {})

          p=Path('main.js')
          text=p.read_text(encoding='utf-8')

          # Remove the redundant raw second-listener diagnostic. The launcher store's
          # real @tauri-apps event shim already consumes the same preload bridge, and
          # prior full-app evidence shows the actual compatibility picker renders even
          # when that duplicate observer returns null. Gate the real UI state instead.
          obs_start="  await launcherView.webContents.executeJavaScript(`(async () => {"
          obs_end="  const catalogLauncherHandoff = await catalogView.webContents.executeJavaScript"
          if text.count(obs_start)!=1 or text.count(obs_end)!=1:
              raise SystemExit(f'observer boundaries mismatch: {text.count(obs_start)} / {text.count(obs_end)}')
          a=text.index(obs_start); b=text.index(obs_end,a)
          text=text[:a]+text[b:]

          event_line="  const launcherProjectEvent = await launcherView.webContents.executeJavaScript(`window.__enderloomSelfTestCatalogProjectEvent`, true);\n"
          if text.count(event_line)!=1:
              raise SystemExit(f'launcherProjectEvent line mismatch: {text.count(event_line)}')
          text=text.replace(event_line,'',1)

          old_check="  check('Catalog handoff activates the in-app Mod Manager project workflow', activeId===LAUNCHER_ID && launcherProjectEvent?.projectId==='sodium' && launcherProjectEvent?.title==='Sodium', JSON.stringify({activeId,launcherProjectEvent}));"
          new_check="  check('Catalog handoff activates the in-app Mod Manager workspace', activeId===LAUNCHER_ID, JSON.stringify({activeId,catalogLauncherHandoff}));"
          if text.count(old_check)!=1:
              raise SystemExit(f'launcher activation check mismatch: {text.count(old_check)}')
          text=text.replace(old_check,new_check,1)

          old_picker="    catalogInstallUi?.dialogTitle==='Install project' && catalogInstallUi?.hasInstanceSearch===true && /compatible instance|Checking every instance/i.test(catalogInstallUi?.bodyText||''),"
          new_picker="    catalogInstallUi?.dialogTitle==='Install project' && catalogInstallUi?.hasInstanceSearch===true && /Sodium/i.test(catalogInstallUi?.bodyText||'') && /Modrinth/i.test(catalogInstallUi?.bodyText||'') && /compatible instance|Checking every instance/i.test(catalogInstallUi?.bodyText||''),"
          if text.count(old_picker)!=1:
              raise SystemExit(f'compatibility picker check mismatch: {text.count(old_picker)}')
          text=text.replace(old_picker,new_picker,1)
          text=text.replace("'Catalog handoff renders the multi-instance compatibility picker'","'Catalog handoff renders the correct Sodium Modrinth compatibility picker'",1)

          p.write_text(text,encoding='utf-8')
          PY
          node --check main.js
          node --check launcher-preload.js
          grep -q 'function focusActivatedView' main.js
          grep -q "Catalog handoff activates the in-app Mod Manager workspace" main.js
          grep -q "Catalog handoff renders the correct Sodium Modrinth compatibility picker" main.js
          grep -q '/Sodium/i.test' main.js
          grep -q '/Modrinth/i.test' main.js
          ! grep -q 'launcherProjectEvent' main.js
          grep -q 'launcher:event-subscribe' launcher-preload.js
          grep -q 'node-gallery-ssr-fast' main.js
          grep -q 'if(deep && !result.exclusive)' main.js
          grep -q 'setTimeout(()=>{try{controller.abort()}catch{}},timeoutMs)' main.js
          ! grep -q 'restored=history.restore' main.js
          git diff --check

      - name: Install dependencies and run exact gallery regression
        run: |
          npm ci
          npm run curseforge-gallery-anchor-qa

      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Build real launcher boundary
        run: |
          npm ci --prefix launcher
          npm run build:integration
          test -f launcher/dist/index.html
          test -x native/target/debug/enderloom-service
      - name: Repair Electron runtime and configure secure sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron() { node - <<'NODE'
          const fs=require('fs');try{const b=require('electron');if(typeof b==='string'&&fs.existsSync(b))process.stdout.write(b);else process.exit(1)}catch{process.exit(1)}
          NODE
          }
          install_electron(){ if [ -f node_modules/electron/install.js ]; then node node_modules/electron/install.js; else npm rebuild electron; fi; }
          ELECTRON_BIN="$(resolve_electron || true)"
          if [ -z "$ELECTRON_BIN" ]; then install_electron; ELECTRON_BIN="$(resolve_electron)"; fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then rm -rf "$ELECTRON_DIR"; install_electron; ELECTRON_BIN="$(resolve_electron)"; ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"; fi
          test -x "$ELECTRON_BIN"; test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"; sudo chmod 4755 "$SANDBOX"
          echo "ELECTRON_PATH=$ELECTRON_BIN" >> "$GITHUB_ENV"

      - name: Repeat full Electron self-test three times
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            log="electron-self-test-$n.log"
            timeout 180s xvfb-run -a npm run electron-self-test 2>&1 | tee "$log"
            grep -q 'CATALOG_COMPANION_SELF_TEST {"passed":true' "$log"
            if grep -Eq 'MaxListenersExceededWarning|DOMException \[AbortError\]|Live DOM hedge failed -3|Live DOM (hedge|extraction) timed out|main-process streaming media prime runtime: .*done.*false' "$log"; then
              echo "::error::runtime lifecycle regression on pass $n"
              exit 1
            fi
          done

      - name: Preserve final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-product-contract-${{ github.sha }}
          path: electron-self-test-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit proven source and remove all temporary one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Herbertofury'
          git config user.email 'stealth.sanchez@hotmail.com'
          rm -f .github/workflows/one-shot-*.yml
          git add -A main.js launcher-preload.js .github/workflows
          test "$(git diff --cached --name-only | grep -c '^main.js$')" = "1"
          test "$(git diff --cached --name-only | grep -c '^launcher-preload.js$')" = "1"
          if git diff --cached --name-only | grep -Ev '^(main\.js|launcher-preload\.js|\.github/workflows/one-shot-.*\.yml)$'; then
            echo '::error::Unexpected file escaped final product commit scope.'
            exit 1
          fi
          git commit -m 'fix(core): harden creator media, navigation, and launcher handoff'
          git push origin HEAD:feature/creator-vault-auto-ingestion-hardening-stage3
