name: Apply Creator Live Path Hardening

on:
  push:
    branches:
      - 'feature/creator-vault-live-fix'

permissions:
  contents: write

concurrency:
  group: creator-vault-live-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-live-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply reviewed live-path hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('src/creator-vault-auto/parser.js')
          s = parser.read_text()
          s = s.replace("function headingInfo(line) {", "function headingInfo(line, videoTitle='') {")
          old = """  for (const [pattern, type] of include) if (pattern.test(key)) return { kind:'include', type };\n  if (/^(music|songs?|socials?|social media|sponsors?|sponsored|credits?|setup|links?|other links?|support|contact|gear|pc specs?|hardware|chapters?)$/.test(key)) return { kind:'exclude' };\n"""
          new = """  for (const [pattern, type] of include) if (pattern.test(key)) return { kind:'include', type };\n  const titleText = String(videoTitle || '').toLowerCase();\n  const typeFromContext = /resource|texture/.test(`${key} ${titleText}`) ? 'resourcepack'\n    : /shader/.test(`${key} ${titleText}`) ? 'shader'\n    : /data ?pack/.test(`${key} ${titleText}`) ? 'datapack'\n    : /plugin/.test(`${key} ${titleText}`) ? 'plugin'\n    : 'mod';\n  if (/\\b(mods?|addons?|resource ?packs?|texture ?packs?|shaders?|data ?packs?|datapacks?|plugins?)\\b/.test(key)\n      && /\\b(links?|downloads?|list|used|order)\\b/.test(key)) return { kind:'include', type:typeFromContext };\n  if (/^(downloads?|download links?)$/.test(key)\n      && /\\b(mods?|addons?|resource ?packs?|texture ?packs?|shaders?|data ?packs?|datapacks?|plugins?)\\b/.test(titleText)) return { kind:'include', type:typeFromContext };\n  if (/^(music|songs?|socials?|social media|sponsors?|sponsored|credits?|setup|links?|other links?|support|contact|gear|pc specs?|hardware|chapters?)$/.test(key)) return { kind:'exclude' };\n"""
          if old not in s:
              raise SystemExit('parser heading marker missing')
          s = s.replace(old, new)
          s = s.replace("const heading = headingInfo(withoutTimestamp);", "const heading = headingInfo(withoutTimestamp, title);")
          old = """  for (const script of scripts) visit(script);\n  return [...items.values()];\n}\n"""
          new = """  for (const script of scripts) visit(script);\n  const normalizedSource = source.replace(/\\\\u002[fF]/g,'/').replace(/\\\\\\//g,'/');\n  for (const match of normalizedSource.matchAll(/\\/@([A-Za-z0-9._-]+)\\/video\\/(\\d{8,})/g)) {\n    const author = clean(match[1]), id = clean(match[2]);\n    if (!items.has(id)) items.set(id,{id,desc:'',author,createTime:'',url:`https://www.tiktok.com/@${author}/video/${id}`});\n  }\n  return [...items.values()];\n}\n"""
          if old not in s:
              raise SystemExit('parser TikTok marker missing')
          parser.write_text(s.replace(old, new))

          browser = Path('src/creator-vault-auto/browser.js')
          s = browser.read_text()
          start = s.index('async function enumerateTikTok(')
          end = s.index('\nasync function enumerateCreatorVideos', start)
          replacement = '''async function enumerateTikTok(creator, knownIds, full, settings) {\n  const url = safeUrl(creator.url);\n  if (!url) throw new Error(`Creator ${creator.id} has an invalid TikTok URL`);\n  const known = new Set(knownIds || []);\n  const incrementalLimit = Math.max(1, Number(settings.maxIncrementalVideosPerCreator) || 16);\n  let initial = [];\n  try {\n    const response = await requestText(url, { timeoutMs:6500 });\n    initial = collectTikTokItemsFromHtml(response.text || '');\n    const touchesKnown = initial.some(item => known.has(item.id));\n    if (!full && initial.length >= Math.min(incrementalLimit, 8) && (!known.size || touchesKnown)) {\n      return initial.map(item => ({ id:item.id, url:item.url, title:item.desc || '', sourceTab:'profile-http' }));\n    }\n  } catch {}\n  let snap;\n  try {\n    snap = await browserSnapshot(url, {\n      platform:'tiktok',\n      full,\n      knownIds,\n      maxPasses:settings.browserHistoryScrollPasses,\n      maxItems:full ? 0 : Math.max(24, incrementalLimit * 3),\n    });\n  } catch (browserError) {\n    if (initial.length) return initial.map(item => ({ id:item.id, url:item.url, title:item.desc || '', sourceTab:'profile-http-fallback' }));\n    throw browserError;\n  }\n  const rows = new Map(initial.map(item => [item.id,{id:item.id,url:item.url,title:item.desc||'',sourceTab:'profile-http'}]));\n  for (const link of snap.links || []) if (link.id) rows.set(link.id, { id:link.id, url:link.href, title:link.text || '', sourceTab:'profile-browser' });\n  for (const item of collectTikTokItemsFromHtml(snap.html || '')) if (!rows.has(item.id)) rows.set(item.id, { id:item.id, url:item.url, title:item.desc || '', sourceTab:'profile-browser' });\n  return [...rows.values()];\n}\n'''
          s = s[:start] + replacement + s[end:]
          start = s.index('async function readTikTok(')
          end = s.index('\nasync function readCreatorVideo', start)
          replacement = '''async function readTikTok(ref) {\n  const [embedResult, pageResult] = await Promise.allSettled([\n    requestJson(`https://www.tiktok.com/oembed?url=${encodeURIComponent(ref.url)}`, { timeoutMs:4500 }),\n    requestText(ref.url, { timeoutMs:5500 }),\n  ]);\n  const embed = embedResult.status === 'fulfilled' ? embedResult.value : null;\n  const pageItems = pageResult.status === 'fulfilled' ? collectTikTokItemsFromHtml(pageResult.value.text || '') : [];\n  const direct = pageItems.find(item => item.id === ref.id);\n  if (direct?.desc) return { id:ref.id, title:String(embed?.title || ref.title || direct.desc), description:direct.desc, publishedAt:'', url:ref.url, links:[] };\n  if (embed?.title && String(embed.title).length > 8) return { id:ref.id, title:String(embed.title), description:String(embed.title), publishedAt:'', url:ref.url, links:[] };\n  const row = await browserVideoDetails(ref.url, 'tiktok');\n  return { id:ref.id, title:String(row.title || ref.title || ''), description:String(row.description || ''), publishedAt:'', url:ref.url, links:row.links || [] };\n}\n'''
          browser.write_text(s[:start] + replacement + s[end:])

          facade = Path('src/creator-vault-runtime.js')
          s = facade.read_text()
          marker = 'function assertCatalogSender(event) {'
          insert = '''function refreshOpenCatalogViews() {\n  if (!electron?.webContents?.getAllWebContents) return 0;\n  let reloaded = 0;\n  for (const contents of electron.webContents.getAllWebContents()) {\n    try {\n      if (contents.isDestroyed()) continue;\n      const url = decodeURIComponent(String(contents.getURL?.() || ''));\n      if (!url.startsWith('file:') || !url.includes('/catalog-center/runtime/') || !/\\.html(?:[?#].*)?$/i.test(url)) continue;\n      contents.reloadIgnoringCache();\n      reloaded++;\n    } catch {}\n  }\n  return reloaded;\n}\n'''
          if insert not in s:
              s = s.replace(marker, insert + marker)
          old = "await runtime.runSync({ full:false, trigger:'launch', maxVideosPerCreator:state.settings.maxIncrementalVideosPerCreator }, null);"
          new = "const result = await runtime.runSync({ full:false, trigger:'launch', maxVideosPerCreator:state.settings.maxIncrementalVideosPerCreator }, null);\n        if (Number(result?.refresh?.patched || 0) > 0) refreshOpenCatalogViews();"
          if old not in s:
              raise SystemExit('facade launch-sync marker missing')
          s = s.replace(old, new)
          s = s.replace('  ensureCreatorVaultRuntimeRegistered,\n', '  ensureCreatorVaultRuntimeRegistered,\n  refreshOpenCatalogViews,\n')
          facade.write_text(s)

          smoke = Path('scripts/creator-vault-live-smoke.js')
          s = smoke.read_text()
          old = "assert(projects.length >= 5, `expected recommendation list, extracted ${projects.length}`);"
          new = "assert(projects.length >= 5, `expected recommendation list, extracted ${projects.length}; title=${JSON.stringify(details.title)}; description=${JSON.stringify(String(details.description||'').slice(0,1400))}`);"
          if old not in s:
              raise SystemExit('live-smoke assertion marker missing')
          smoke.write_text(s.replace(old, new))

          qa = Path('scripts/creator-vault-auto-ingestion-qa.js')
          s = qa.read_text()
          marker = "check('timestamp chapters are inferred only for project-list titles', () => {"
          insert = """check('creator mod-download headings are treated as project sections', () => {\n  const rows = parser.parseCreatorDescription({\n    title:'Top 10 Minecraft Mods You Need',\n    platform:'youtube',\n    text:'MOD DOWNLOADS:\\nSodium - https://modrinth.com/mod/sodium\\nLithium - https://modrinth.com/mod/lithium',\n  });\n  assert.deepStrictEqual(rows.map(row=>row.name), ['Sodium','Lithium']);\n  const generic = parser.parseCreatorDescription({\n    title:'My Favorite Minecraft Mods',\n    platform:'youtube',\n    text:'Downloads:\\nModernFix https://www.curseforge.com/minecraft/mc-mods/modernfix',\n  });\n  assert.strictEqual(generic.length,1);\n  assert.strictEqual(generic[0].name,'ModernFix');\n});\n\n"""
          if insert not in s:
              s = s.replace(marker, insert + marker)
          marker = "check('provider URL classifier rejects social noise', () => {"
          insert = """check('TikTok raw profile video paths are usable without hydration JSON', () => {\n  const rows = parser.collectTikTokItemsFromHtml('<a href=\"/@tester/video/7412345678901234567\">video</a>');\n  assert.strictEqual(rows.length,1);\n  assert.strictEqual(rows[0].id,'7412345678901234567');\n  assert(rows[0].url.includes('@tester/video/7412345678901234567'));\n});\n\n"""
          if insert not in s:
              s = s.replace(marker, insert + marker)
          marker = "check('parser stress stays comfortably interactive', () => {"
          insert = """check('TikTok metadata requests are parallel and launch sync refreshes open catalog views', () => {\n  const browserSource = fs.readFileSync(path.join(ROOT,'src','creator-vault-auto','browser.js'),'utf8');\n  const facadeSource = fs.readFileSync(path.join(ROOT,'src','creator-vault-runtime.js'),'utf8');\n  assert(browserSource.includes('Promise.allSettled'));\n  assert(browserSource.includes('profile-http-fallback'));\n  assert(facadeSource.includes('refreshOpenCatalogViews'));\n  assert(facadeSource.includes('reloadIgnoringCache'));\n});\n\n"""
          if insert not in s:
              s = s.replace(marker, insert + marker)
          qa.write_text(s)
          PY
          node --check src/creator-vault-auto/parser.js
          node --check src/creator-vault-auto/browser.js
          node --check src/creator-vault-runtime.js
          node --check scripts/creator-vault-live-smoke.js
          node --check scripts/creator-vault-auto-ingestion-qa.js
          node scripts/creator-vault-auto-ingestion-qa.js
          git diff --check
      - name: Commit staged fix as one tested source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-creator-live-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(creator-vault): harden real creator source formats'
          git push origin HEAD:feature/creator-vault-live-fix
