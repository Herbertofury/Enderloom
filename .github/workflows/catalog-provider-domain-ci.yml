name: Catalog provider domain regression

on:
  push:
    branches: [main]
    paths: ['src/ingest.js', 'src/zip-lite.js', 'scripts/catalog-provider-domain-qa.js', '.github/workflows/catalog-provider-domain-ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/ingest.js', 'src/zip-lite.js', 'scripts/catalog-provider-domain-qa.js', '.github/workflows/catalog-provider-domain-ci.yml']

permissions:
  contents: read

jobs:
  provider-domains:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/catalog-provider-domain-qa.js
