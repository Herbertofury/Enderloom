name: Creator Vault Automatic Ingestion QA

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion'
  pull_request:
    paths:
      - 'src/creator-vault-runtime.js'
      - 'src/creator-vault-auto/**'
      - 'src/catalog-renderer.js'
      - 'catalog-preload.js'
      - 'catalog/creator-vault/**'
      - 'scripts/creator-vault-auto-ingestion-qa.js'
      - '.github/workflows/creator-vault-auto-ingestion-challenge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automatic-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      ENDERLOOM_DISABLE_CREATOR_AUTO_SYNC: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Syntax gate
        run: |
          node --check src/creator-vault-runtime.js
          node --check src/creator-vault-auto/common.js
          node --check src/creator-vault-auto/state.js
          node --check src/creator-vault-auto/parser.js
          node --check src/creator-vault-auto/browser.js
          node --check src/creator-vault-auto/resolver.js
          node --check src/creator-vault-auto/runtime.js
          node --check src/catalog-renderer.js
          node --check catalog-preload.js
          node --check catalog/creator-vault/creator-vault-auto.js
          node --check scripts/creator-vault-auto-ingestion-qa.js
          node --check scripts/run.js
      - name: Automatic ingestion contract and stress QA
        run: node scripts/creator-vault-auto-ingestion-qa.js
      - name: Existing Creator Vault regression QA
        run: npm run creator-vault-qa
      - name: Catalog regression QA
        run: npm run catalog-qa
      - name: Render portable catalogs
        run: npm run portable
      - name: Build current launcher frontend and Rust service
        run: |
          npm ci --prefix launcher
          npm run build:integration
          test -f launcher/dist/index.html
          test -x native/target/debug/enderloom-service
      - name: Repair Electron runtime if incomplete and configure SUID sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron() {
            node - <<'NODE'
          const fs = require('fs');
          try {
            const binary = require('electron');
            if (typeof binary === 'string' && fs.existsSync(binary)) process.stdout.write(binary);
            else process.exit(1);
          } catch {
            process.exit(1);
          }
          NODE
          }
          install_electron() {
            if [ -f node_modules/electron/install.js ]; then
              node node_modules/electron/install.js
            else
              npm rebuild electron
            fi
          }
          ELECTRON_BIN="$(resolve_electron || true)"
          if [ -z "$ELECTRON_BIN" ]; then
            echo 'Electron binary missing after npm ci; running the official Electron installer.'
            install_electron
            ELECTRON_BIN="$(resolve_electron)"
          fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"
          SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then
            echo 'Electron distribution is incomplete (chrome-sandbox missing); repairing the official dist once.'
            rm -rf "$ELECTRON_DIR"
            install_electron
            ELECTRON_BIN="$(resolve_electron)"
            ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"
            SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          fi
          if [ ! -x "$ELECTRON_BIN" ] || [ ! -f "$SANDBOX" ]; then
            echo '::error::Electron runtime is still incomplete after repair.'
            ls -la "$ELECTRON_DIR" || true
            exit 1
          fi
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          stat -c '%U:%G %a %n' "$SANDBOX"
          echo "ELECTRON_PATH=$ELECTRON_BIN" >> "$GITHUB_ENV"
          echo "ENDERLOOM_ELECTRON_BIN=$ELECTRON_BIN" >> "$GITHUB_ENV"
      - name: Electron self-test
        id: electron_self_test
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a npm run electron-self-test 2>&1 | tee electron-self-test.log
      - name: Preserve Electron self-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-self-test-log-${{ github.run_id }}
          path: electron-self-test.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Electron self-test result
        if: steps.electron_self_test.outcome == 'failure'
        run: exit 1
