name: Promote Tested Creator Live Fix

on:
  push:
    branches:
      - 'feature/creator-vault-live-fix'

permissions:
  contents: write

concurrency:
  group: creator-vault-live-fix-promotion
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-live-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reverify focused Creator Vault hardening
        run: |
          node --check src/creator-vault-auto/parser.js
          node --check src/creator-vault-auto/browser.js
          node --check src/creator-vault-runtime.js
          node --check scripts/creator-vault-live-smoke.js
          node --check scripts/creator-vault-auto-ingestion-qa.js
          node scripts/creator-vault-auto-ingestion-qa.js
          git diff --check
      - name: Remove promoter and fast-forward feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/promote-creator-live-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove creator live-fix promoter'
            git push origin HEAD:feature/creator-vault-live-fix
          fi
          git push origin HEAD:feature/creator-vault-auto-ingestion
