name: Guarantee Automatic Creator Ingestion Boot Hook

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add explicit main-process boot hook
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const pkg=require('./package.json');
          const main=pkg.main||'main.js';
          if(!fs.existsSync(main))throw new Error(`Electron main entry not found: ${main}`);
          let text=fs.readFileSync(main,'utf8');
          if(!text.includes('ensureCreatorVaultAutomaticIngestion')){
            let rel=path.relative(path.dirname(main),path.join('src','creator-vault-runtime')).replace(/\\/g,'/');
            if(!rel.startsWith('.'))rel='./'+rel;
            const hook=`const { ensureCreatorVaultRuntimeRegistered: ensureCreatorVaultAutomaticIngestion } = require(${JSON.stringify(rel)});\nensureCreatorVaultAutomaticIngestion();\n`;
            const strict=text.match(/^(?:#![^\n]*\n)?(['\"]use strict['\"];?\s*\n)/);
            if(strict){const at=strict[0].length;text=text.slice(0,at)+hook+text.slice(at);}else{text=hook+text;}
            fs.writeFileSync(main,text);
          }
          const qa='scripts/creator-vault-auto-ingestion-qa.js';
          let test=fs.readFileSync(qa,'utf8');
          if(!test.includes('explicit main-process automatic-ingestion boot hook')){
            const marker="  console.log(`Creator Vault automatic-ingestion QA passed:";
            const at=test.indexOf(marker);
            if(at<0)throw new Error('QA insertion marker missing');
            const assertion=`  const pkg=require('../package.json');\n  const mainEntry=path.resolve(root,pkg.main||'main.js');\n  const mainSource=fs.readFileSync(mainEntry,'utf8');\n  assert(mainSource.includes('ensureCreatorVaultAutomaticIngestion'),'explicit main-process automatic-ingestion boot hook missing');\n\n`;
            test=test.slice(0,at)+assertion+test.slice(at);
            fs.writeFileSync(qa,test);
          }
          NODE
          rm -f .github/workflows/patch-auto-ingestion-boot-hook.yml
      - name: Install dependencies
        run: npm ci
      - name: Verify boot hook and all regressions
        run: |
          node --check "$(node -p "require('./package.json').main || 'main.js'")"
          node scripts/creator-vault-auto-ingestion-qa.js
          npm run creator-vault-qa
          npm run catalog-qa
          npm run portable
      - name: Commit hardened boot integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Boot hook already present.'
            exit 0
          fi
          git commit -m 'fix(creator-vault): start automatic ingestion from app boot'
          git push origin HEAD:feature/creator-vault-auto-ingestion
