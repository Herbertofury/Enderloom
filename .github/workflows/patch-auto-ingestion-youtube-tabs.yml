name: Harden YouTube Automatic Ingestion Tabs

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch YouTube tab enumeration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/creator-vault-runtime/adapters.js';
          let text = fs.readFileSync(file,'utf8');
          const start = text.indexOf("  if(platform==='youtube'){");
          const end = text.indexOf("  if(platform==='tiktok'){");
          if (start < 0 || end < 0 || end <= start) throw new Error('YouTube adapter block not found');
          const replacement = `  if(platform==='youtube'){\n    const root=base.replace(/\\/(?:videos|shorts|streams)\\/?$/i,'').replace(/\\/$/,'');\n    const pages=[root+'/videos',root+'/shorts',...(full?[root+'/streams']:[])];\n    const rows=new Map();\n    let lastError=null;\n    for(const page of pages){\n      try{\n        const snap=await browserSnapshot(page,{platform:'youtube',full,knownIds});\n        for(const link of snap.links||[]){const id=youtubeVideoId(link.href)||link.id;if(id&&!rows.has(id))rows.set(id,{id,url:\\`https://www.youtube.com/watch?v=\\${id}\\`,title:link.text||''});}\n      }catch(error){\n        lastError=error;\n        try{\n          const res=await requestText(page,{timeoutMs:7000});\n          const ids=unique([...String(res.text||'').matchAll(/(?:watch\\?v=|\"videoId\":\")([A-Za-z0-9_-]{11})/g)].map(m=>m[1]));\n          for(const id of ids)if(!rows.has(id))rows.set(id,{id,url:\\`https://www.youtube.com/watch?v=\\${id}\\`,title:''});\n        }catch{}\n      }\n    }\n    if(rows.size)return [...rows.values()];\n    if(lastError)throw lastError;\n    return [];\n  }\n`;
          text = text.slice(0,start) + replacement + text.slice(end);
          fs.writeFileSync(file,text);
          const docs = 'docs/CREATOR-VAULT-AUTOMATIC-INGESTION.md';
          if (fs.existsSync(docs)) {
            let md = fs.readFileSync(docs,'utf8');
            md = md.replace('enumerates creator uploads from the real channel page.', 'enumerates regular uploads and Shorts from their real channel tabs; explicit full-history scans also sweep Streams.');
            fs.writeFileSync(docs,md);
          }
          NODE
          rm -f .github/workflows/patch-auto-ingestion-youtube-tabs.yml
      - name: Install dependencies
        run: npm ci
      - name: Verify patched runtime
        run: |
          node --check src/creator-vault-runtime/adapters.js
          node scripts/creator-vault-auto-ingestion-qa.js
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('src/creator-vault-runtime/adapters.js','utf8');
          for(const marker of ["root+'/videos'","root+'/shorts'","root+'/streams'"]) if(!text.includes(marker)) throw new Error(`YouTube tab coverage missing ${marker}`);
          console.log('YouTube videos/shorts/streams coverage locked.');
          NODE
          npm run creator-vault-qa
          npm run catalog-qa
          npm run portable
      - name: Commit hardened implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'fix(creator-vault): ingest YouTube videos shorts and streams'
          git push origin HEAD:feature/creator-vault-auto-ingestion
