name: Apply And Live Test Creator Fallback Hardening

on:
  push:
    branches:
      - 'feature/creator-vault-live-fix2'

permissions:
  contents: write

concurrency:
  group: creator-vault-live-fix2
  cancel-in-progress: true

jobs:
  patch-live-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENDERLOOM_DISABLE_CREATOR_AUTO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-live-fix2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply direct-link and renderer fallback hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('src/creator-vault-auto/parser.js')
          s = parser.read_text()
          marker = "function parseCreatorDescription({ text='', title='', platform='youtube', links=[] } = {}) {"
          helper = """function directProjectNameFromUrl(value) {\n  const safe = safeUrl(value);\n  if (!safe) return '';\n  try {\n    const url = new URL(safe);\n    const host = url.hostname.toLowerCase();\n    let slug = '';\n    if (host === 'modrinth.com' || host.endsWith('.modrinth.com')) {\n      slug = url.pathname.match(/^\\/(?:mod|modpack|resourcepack|shader|plugin|datapack)\\/([^/]+)/i)?.[1] || '';\n    } else if (host === 'curseforge.com' || host.endsWith('.curseforge.com')) {\n      slug = url.pathname.match(/^\\/minecraft\\/(?:mc-mods|modpacks|texture-packs|shaders|data-packs)\\/([^/]+)/i)?.[1] || '';\n    } else if (host === 'github.com' || host.endsWith('.github.com')) {\n      const parts = url.pathname.split('/').filter(Boolean);\n      if (parts.length >= 2 && !['orgs','topics','search','marketplace','features'].includes(parts[0].toLowerCase())) slug = parts[1];\n    }\n    if (!slug) return '';\n    return clean(decodeURIComponent(slug).replace(/[-_]+/g,' '));\n  } catch {\n    return '';\n  }\n}\n\n"""
          if helper not in s:
              if marker not in s: raise SystemExit('parser insertion marker missing')
              s = s.replace(marker, helper + marker)
          old = """    const inferredChapterList = !sawProjectSection && titleSuggestsProjects && timestamp.seconds != null && !afterOutro;\n    if (!(active || inferredChapterList)) continue;\n    const name = cleanCandidateName(line, urls, timestamp.timestamp);\n"""
          new = """    const inferredChapterList = !sawProjectSection && titleSuggestsProjects && timestamp.seconds != null && !afterOutro;\n    if (!(active || inferredChapterList)) {\n      if (titleSuggestsProjects && providerUrls.length && !afterOutro) {\n        const directName = cleanCandidateName(line, urls, timestamp.timestamp) || directProjectNameFromUrl(providerUrls[0]);\n        if (directName) {\n          push({\n            name:directName,\n            projectType:sectionType,\n            timestamp:timestamp.timestamp,\n            timestampSeconds:timestamp.seconds,\n            urls:providerUrls,\n            confidence:0.97,\n            evidence:'Creator-authored direct project link',\n            sourceKinds:unique([platform,'description','direct-link']),\n          });\n        }\n      }\n      continue;\n    }\n    const name = cleanCandidateName(line, urls, timestamp.timestamp);\n"""
          if old not in s:
              raise SystemExit('parser direct-link marker missing')
          parser.write_text(s.replace(old, new))

          browser = Path('src/creator-vault-auto/browser.js')
          s = browser.read_text()
          old = """    const result = await win.webContents.executeJavaScript(`(async()=>{\n      const platform=${JSON.stringify(platform)};\n"""
          new = """    let result;\n    try {\n      result = await win.webContents.executeJavaScript(`(async()=>{\n      const platform=${JSON.stringify(platform)};\n"""
          if old not in s:
              raise SystemExit('browser fallback start marker missing')
          s = s.replace(old, new, 1)
          old = """      return {url:location.href,title:document.title||'',text:document.body?.innerText||'',html:document.documentElement?.outerHTML||'',links:[...rows.values()]};\n    })()`, true);\n    return result || { url, title:'', text:'', html:'', links:[] };\n"""
          new = """      return {url:location.href,title:document.title||'',text:document.body?.innerText||'',html:document.documentElement?.outerHTML||'',links:[...rows.values()]};\n    })()`, true);\n    } catch {\n      const fallbackPasses = Math.min(18, clampInt(maxPasses, 18, 2, 40));\n      for (let index = 0; index < fallbackPasses; index++) {\n        try {\n          await win.webContents.executeJavaScript('window.scrollTo(0,document.documentElement?.scrollHeight||0); true', true);\n          await sleep(platform === 'tiktok' ? 260 : 180);\n        } catch { break; }\n      }\n      let html = '', text = '', title = '';\n      try { html = await win.webContents.executeJavaScript('document.documentElement?.outerHTML||\"\"', true); } catch {}\n      try { text = await win.webContents.executeJavaScript('document.body?.innerText||\"\"', true); } catch {}\n      try { title = await win.webContents.executeJavaScript('document.title||\"\"', true); } catch {}\n      result = { url:win.webContents.getURL() || url, title, text, html, links:[], fallback:true };\n    }\n    return result || { url, title:'', text:'', html:'', links:[] };\n"""
          if old not in s:
              raise SystemExit('browser fallback end marker missing')
          browser.write_text(s.replace(old, new, 1))

          qa = Path('scripts/creator-vault-auto-ingestion-qa.js')
          s = qa.read_text()
          marker = "check('timestamp chapters are inferred only for project-list titles', () => {"
          insert = """check('project URLs in recommendation descriptions self-identify without a heading', () => {\n  const rows = parser.parseCreatorDescription({\n    title:'Top Minecraft Mods',\n    platform:'youtube',\n    text:'Sodium https://modrinth.com/mod/sodium\\nhttps://www.curseforge.com/minecraft/mc-mods/modernfix',\n  });\n  assert.strictEqual(rows.length,2);\n  assert.strictEqual(rows[0].name,'Sodium');\n  assert(/modernfix/i.test(rows[1].name));\n});\n\n"""
          if insert not in s:
              s = s.replace(marker, insert + marker)
          marker = "check('TikTok metadata requests are parallel and launch sync refreshes open catalog views', () => {"
          insert = """check('browser snapshot has a renderer-script fallback path', () => {\n  const source = fs.readFileSync(path.join(ROOT,'src','creator-vault-auto','browser.js'),'utf8');\n  assert(source.includes('fallbackPasses'));\n  assert(source.includes('document.documentElement?.outerHTML'));\n});\n\n"""
          if insert not in s:
              s = s.replace(marker, insert + marker)
          qa.write_text(s)
          PY
          node --check src/creator-vault-auto/parser.js
          node --check src/creator-vault-auto/browser.js
          node --check scripts/creator-vault-auto-ingestion-qa.js
          node scripts/creator-vault-auto-ingestion-qa.js
          git diff --check
      - name: Repair Electron runtime and configure SUID sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron() {
            node - <<'NODE'
          const fs = require('fs');
          try {
            const binary = require('electron');
            if (typeof binary === 'string' && fs.existsSync(binary)) process.stdout.write(binary);
            else process.exit(1);
          } catch { process.exit(1); }
          NODE
          }
          install_electron() {
            if [ -f node_modules/electron/install.js ]; then node node_modules/electron/install.js; else npm rebuild electron; fi
          }
          ELECTRON_BIN="$(resolve_electron || true)"
          if [ -z "$ELECTRON_BIN" ]; then install_electron; ELECTRON_BIN="$(resolve_electron)"; fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"
          SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then
            rm -rf "$ELECTRON_DIR"
            install_electron
            ELECTRON_BIN="$(resolve_electron)"
            ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"
            SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          fi
          test -x "$ELECTRON_BIN"
          test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          echo "ENDERLOOM_ELECTRON_BIN=$ELECTRON_BIN" >> "$GITHUB_ENV"
      - name: Exercise real creator/provider paths
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a "$ENDERLOOM_ELECTRON_BIN" scripts/creator-vault-live-smoke.js 2>&1 | tee creator-vault-live-fix2.log
      - name: Preserve live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-vault-live-fix2-${{ github.run_id }}
          path: creator-vault-live-fix2.log
          retention-days: 7
      - name: Commit and promote only after live success
        if: steps.live.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-and-live-test-creator-fix2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(creator-vault): harden live source fallbacks'
          git push origin HEAD:feature/creator-vault-live-fix2
          git push origin HEAD:feature/creator-vault-auto-ingestion
      - name: Enforce live result
        if: steps.live.outcome == 'failure'
        run: exit 1
