name: Minecraft Dev Kit Native Runtime
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/minecraft-dev-kit/**'
      - '.github/workflows/devkit-native-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devkit-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fabric-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: librariantradefinder
            repository: itzwrld/LibrarianTradeFinder-26.2
            source: 285757d72aab0db76a5c9bc985e6cc968793601a
            modid: librarian-trade-finder
          - name: aoba
            repository: Cocolots/Aoba-Client
            source: c698b09d4f4e76db4b1dee0a0d6b2051324b9ce0
            modid: aoba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare real graphics and audio runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers libopenal1 libflite1 flite1-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: devkit-native-${{ runner.os }}-26.3-${{ matrix.name }}-v1
          restore-keys: |
            devkit-native-${{ runner.os }}-26.3-
            fabric-${{ matrix.name }}-263-${{ runner.os }}-
            fabric-ui-aw-263-${{ runner.os }}-
      - name: Retrieve exact source and build through the production converter
        env:
          SOURCE_REPO: ${{ matrix.repository }}
          SOURCE_SHA: ${{ matrix.source }}
        run: |
          git init "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C "$RUNNER_TEMP/source" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$RUNNER_TEMP/source" checkout --detach FETCH_HEAD
          python tools/minecraft-dev-kit/scripts/northpoint_public_mod_smoke.py --project "$RUNNER_TEMP/source" --minecraft 26.3 --loader fabric --java 25 --workspace "$RUNNER_TEMP/candidate" --timeout 900
      - name: Create independent native probe with the exact candidate JAR
        env:
          EXPECTED_MOD: ${{ matrix.modid }}
        run: |
          git clone --depth=1 --branch=26.3 https://github.com/FabricMC/fabric-example-mod.git "$RUNNER_TEMP/probe"
          git -C "$RUNNER_TEMP/probe" rev-parse HEAD > "$RUNNER_TEMP/candidate/probe-source.txt"
          python - <<'PY'
          from pathlib import Path
          import os, json
          root=Path(os.environ['RUNNER_TEMP'])
          probe=root/'probe'
          candidate=json.loads((root/'candidate/summary.json').read_text())
          jar=Path(candidate['artifact_path']).resolve()
          (probe/'candidate.jar').write_bytes(jar.read_bytes())
          with (probe/'build.gradle').open('a') as f:
              f.write('''
          fabricApi {
            configureTests {
              createSourceSet = true
              modId = "devkit-runtime-probe"
              enableGameTests = false
              enableClientGameTests = true
              eula = true
            }
          }
          dependencies {
            productionRuntimeMods files("candidate.jar")
            productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          tasks.register("devkitProbeJar", Jar) {
            archiveClassifier = "gametest"
            from sourceSets.gametest.output
          }
          tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
            mods.from(tasks.named("devkitProbeJar"))
            runDir = file("run/devkit-native")
            jvmArgs.add("-Dfabric.client.gametest")
            jvmArgs.add("--enable-native-access=ALL-UNNAMED")
            useXVFB = true
          }
          ''')
          java=probe/'src/gametest/java/devkit/RuntimeProbe.java'
          java.parent.mkdir(parents=True,exist_ok=True)
          java.write_text('''package devkit;
          import net.fabricmc.loader.api.FabricLoader;
          import net.fabricmc.fabric.api.client.gametest.v1.FabricClientGameTest;
          import net.fabricmc.fabric.api.client.gametest.v1.context.ClientGameTestContext;
          import net.fabricmc.fabric.api.client.gametest.v1.context.TestSingleplayerContext;
          public class RuntimeProbe implements FabricClientGameTest {
            public void runTest(ClientGameTestContext context) {
              if (!FabricLoader.getInstance().isModLoaded("EXPECTED_MOD")) throw new AssertionError("candidate not loaded");
              try (TestSingleplayerContext world = context.worldBuilder().create()) {
                world.getClientLevel().waitForChunksRender();
                context.takeScreenshot("devkit-EXPECTED_MOD-integrated-world");
                System.out.println("DEVKIT_NATIVE_WORLD_READY:EXPECTED_MOD");
              }
              System.out.println("DEVKIT_NATIVE_WORLD_CLOSED:EXPECTED_MOD");
            }
          }
          '''.replace('EXPECTED_MOD',os.environ['EXPECTED_MOD']))
          meta=probe/'src/gametest/resources/fabric.mod.json'
          meta.parent.mkdir(parents=True,exist_ok=True)
          meta.write_text(json.dumps({'schemaVersion':1,'id':'devkit-runtime-probe','version':'1.0.0','environment':'client','entrypoints':{'fabric-client-gametest':['devkit.RuntimeProbe']}}))
          (root/'candidate/native-input.json').write_text(json.dumps(candidate,indent=2))
          PY
      - name: Run the packaged mod in real Minecraft and an integrated world
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
          EXPECTED_MOD: ${{ matrix.modid }}
        run: |
          cd "$RUNNER_TEMP/probe"
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon runProductionClientGameTest 2>&1 | tee "$RUNNER_TEMP/candidate/native-gradle.log"
          grep -F "DEVKIT_NATIVE_WORLD_READY:$EXPECTED_MOD" run/devkit-native/logs/latest.log
          grep -F "DEVKIT_NATIVE_WORLD_CLOSED:$EXPECTED_MOD" run/devkit-native/logs/latest.log
      - name: Preserve native logs, exact artifact, screenshots and harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devkit-native-${{ matrix.name }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate/
            ${{ runner.temp }}/probe/run/
            ${{ runner.temp }}/probe/build/reports/
            ${{ runner.temp }}/probe/src/gametest/
            ${{ runner.temp }}/probe/build.gradle
            ${{ runner.temp }}/probe/gradle.properties
          if-no-files-found: error
          retention-days: 30
