name: Assemble Automatic Creator Ingestion

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion
          fetch-depth: 0
      - name: Materialize tested implementation blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          materialize() {
            path="$1"
            sha="$2"
            mkdir -p "$(dirname "$path")"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' | base64 --decode > "$path"
          }
          materialize src/creator-vault-runtime.js 178b0a1de42723c2ed667ce80be969408f8a2459
          materialize src/creator-vault-runtime/common.js 7f7031682d02cb8e6d1ec11dec94fd991b17bfe0
          materialize src/creator-vault-runtime/state.js 65862133cdf10ef191eb481fe457bf648dc2a6c0
          materialize src/creator-vault-runtime/merge.js 77fa0f3e59ab74b38811af40302c9f91cb5919c9
          materialize src/creator-vault-runtime/parse.js 2736fc58983a4cffc859ef7f7ff52a6c8a82114d
          materialize src/creator-vault-runtime/adapters.js d70af557946838046529192b44dcef2656f315e4
          materialize src/creator-vault-runtime/providers.js 389a6139a52e54191434bed4108ee9cd99b4af61
          materialize src/creator-vault-runtime/refresh.js 822be19c1a9389d4670079c477e70c3724f1b89a
          materialize src/creator-vault-runtime/sync.js 18957debe811f01b5bd807563bef00781c377994
          materialize src/catalog-renderer.js bd4aafd30892257656786cfd0f99c8e90574e8a8
          materialize catalog-preload.js 767fe5218aba35833452266668229bd93543cf3f
          materialize catalog/creator-vault/creator-vault-runtime-ui.js d2a546779140408431fea853faa610c1e5fc22ca
          materialize catalog/creator-vault/creator-vault-runtime.css 03f2240ee1d08d7c2cb916a7a812823eecdc1056
          materialize scripts/creator-vault-auto-ingestion-qa.js 193dc218b03c5e8c423139312e64babee5d17dd6
          materialize .github/workflows/creator-vault-auto-ingestion.yml e26740d5479f6b2cf22087bbe9f0e692db96b05e
          materialize docs/CREATOR-VAULT-AUTOMATIC-INGESTION.md 1a6d982181fbeac9f691be407732facb1bfb7f6f
          rm -f .github/workflows/bootstrap-auto-ingestion.yml
      - name: Commit completed feature
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Implementation already assembled.'
            exit 0
          fi
          git commit -m 'feat(creator-vault): ship automatic creator cataloging'
          git push origin HEAD:feature/creator-vault-auto-ingestion
