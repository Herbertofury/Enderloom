name: Finalize Creator Vault Live Sources

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion'
    paths:
      - '.github/workflows/finalize-creator-vault-live.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-creator-vault-live
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENDERLOOM_DISABLE_CREATOR_AUTO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ensure final feed/direct-link source paths exist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('src/creator-vault-auto/parser.js')
          s = parser.read_text()
          if 'function directProjectNameFromUrl' not in s:
              marker = "function parseCreatorDescription({ text='', title='', platform='youtube', links=[] } = {}) {"
              helper = r'''function directProjectNameFromUrl(value) {
  const safe = safeUrl(value);
  if (!safe) return '';
  try {
    const url = new URL(safe), host = url.hostname.toLowerCase();
    let slug = '';
    if (host === 'modrinth.com' || host.endsWith('.modrinth.com')) slug = url.pathname.match(/^\/(?:mod|modpack|resourcepack|shader|plugin|datapack)\/([^/]+)/i)?.[1] || '';
    else if (host === 'curseforge.com' || host.endsWith('.curseforge.com')) slug = url.pathname.match(/^\/minecraft\/(?:mc-mods|modpacks|texture-packs|shaders|data-packs)\/([^/]+)/i)?.[1] || '';
    else if (host === 'github.com' || host.endsWith('.github.com')) { const parts=url.pathname.split('/').filter(Boolean); if(parts.length>=2&&!['orgs','topics','search','marketplace','features'].includes(parts[0].toLowerCase()))slug=parts[1]; }
    return slug ? clean(decodeURIComponent(slug).replace(/[-_]+/g,' ')) : '';
  } catch { return ''; }
}

'''
              if marker not in s: raise SystemExit('parser insertion marker missing')
              s = s.replace(marker,helper+marker)
              old = "    if (!(active || inferredChapterList)) continue;\n"
              new = r'''    if (!(active || inferredChapterList)) {
      if (titleSuggestsProjects && providerUrls.length && !afterOutro) {
        const directName = cleanCandidateName(line, urls, timestamp.timestamp) || directProjectNameFromUrl(providerUrls[0]);
        if (directName) push({name:directName,projectType:sectionType,timestamp:timestamp.timestamp,timestampSeconds:timestamp.seconds,urls:providerUrls,confidence:0.97,evidence:'Creator-authored direct project link',sourceKinds:unique([platform,'description','direct-link'])});
      }
      continue;
    }
'''
              if old not in s: raise SystemExit('parser direct-link marker missing')
              s = s.replace(old,new,1)
              parser.write_text(s)

          browser = Path('src/creator-vault-auto/browser.js')
          s = browser.read_text()
          if 'youtubeFeedRefs' not in s:
              s = s.replace("const { parseYouTubeWatchHtml, collectTikTokItemsFromHtml } = require('./parser');", "const { parseYouTubeWatchHtml, collectTikTokItemsFromHtml, extractUrls } = require('./parser');")
              marker = "async function enumerateYouTube(creator, knownIds, full, settings) {"
              helpers = r'''function xmlDecode(value) { return String(value || '').replace(/^<!\[CDATA\[/,'').replace(/\]\]>$/,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>'); }
function xmlValue(block, tag) { const match=String(block||'').match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)<\\/${tag}>`,'i')); return match?xmlDecode(match[1]).trim():''; }
function youtubeChannelIdFromHtml(html) {
  const text=String(html||'');
  return text.match(/<meta[^>]+itemprop=["']channelId["'][^>]+content=["'](UC[A-Za-z0-9_-]+)["']/i)?.[1]
    || text.match(/["']channelId["']\s*:\s*["'](UC[A-Za-z0-9_-]+)["']/)?.[1]
    || text.match(/["']externalId["']\s*:\s*["'](UC[A-Za-z0-9_-]+)["']/)?.[1]
    || text.match(/youtube\.com\/channel\/(UC[A-Za-z0-9_-]+)/i)?.[1] || '';
}
function parseYouTubeFeedXml(xml) {
  const rows=[];
  for(const match of String(xml||'').matchAll(/<entry\b[^>]*>([\s\S]*?)<\/entry>/gi)){
    const block=match[1],id=xmlValue(block,'yt:videoId');
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))continue;
    rows.push({id,url:`https://www.youtube.com/watch?v=${id}`,title:xmlValue(block,'title'),description:xmlValue(block,'media:description'),publishedAt:xmlValue(block,'published'),sourceTab:'feed'});
  }
  return rows;
}
async function youtubeFeedRefs(root) {
  let channelId='';
  for(const page of [root,`${root}/videos`]){try{const response=await requestText(page,{timeoutMs:5200,headers:{'Accept-Language':'en-US,en;q=0.9'}});channelId=youtubeChannelIdFromHtml(response.text);if(channelId)break;}catch{}}
  if(!channelId)return[];
  try{const response=await requestText(`https://www.youtube.com/feeds/videos.xml?channel_id=${encodeURIComponent(channelId)}`,{timeoutMs:5200,headers:{Accept:'application/atom+xml,application/xml,text/xml,*/*;q=0.8'}});return parseYouTubeFeedXml(response.text);}catch{return[];}
}

'''
              if marker not in s: raise SystemExit('browser feed marker missing')
              s=s.replace(marker,helpers+marker)
              old="  const known = new Set(knownIds || []);\n  const incrementalLimit = Math.max(1, Number(settings.maxIncrementalVideosPerCreator) || 16);\n"
              new="  const known = new Set(knownIds || []);\n  const feedPromise = full ? Promise.resolve([]) : youtubeFeedRefs(root);\n  const incrementalLimit = Math.max(1, Number(settings.maxIncrementalVideosPerCreator) || 16);\n"
              if old not in s: raise SystemExit('browser enumerate marker missing')
              s=s.replace(old,new,1)
              old="  const tabRows = await mapConcurrent(tabs, Math.min(tabs.length, Math.max(1, Number(settings.browserPoolSize) || 3)), scanTab);\n  const rows = new Map();\n"
              new="  const [feedRows, tabRows] = await Promise.all([feedPromise, mapConcurrent(tabs, Math.min(tabs.length, Math.max(1, Number(settings.browserPoolSize) || 3)), scanTab)]);\n  const rows = new Map((feedRows || []).map(ref=>[ref.id,ref]));\n"
              if old not in s: raise SystemExit('browser tabRows marker missing')
              s=s.replace(old,new,1)
              old=r'''      if (!id || rows.has(id)) continue;
      rows.set(id, {
        id,
        url:tab === 'shorts' ? `https://www.youtube.com/shorts/${id}` : `https://www.youtube.com/watch?v=${id}`,
        title:link.text || '',
        sourceTab:tab,
      });
'''
              new=r'''      if (!id) continue;
      const prior = rows.get(id);
      rows.set(id, {id,url:tab === 'shorts' ? `https://www.youtube.com/shorts/${id}` : `https://www.youtube.com/watch?v=${id}`,title:prior?.title || link.text || '',description:prior?.description || '',publishedAt:prior?.publishedAt || '',sourceTab:prior?.sourceTab === 'feed' ? `feed+${tab}` : tab});
'''
              if old not in s: raise SystemExit('browser row marker missing')
              s=s.replace(old,new,1)
              old="async function readYouTube(ref) {\n  try {\n"
              new="async function readYouTube(ref) {\n  if (String(ref?.description || '').trim()) return {id:ref.id,title:String(ref.title||''),description:String(ref.description||''),publishedAt:String(ref.publishedAt||''),url:ref.url,links:extractUrls(ref.description).map(href=>({href,text:''})),source:'youtube-feed'};\n  try {\n"
              if old not in s: raise SystemExit('browser read marker missing')
              s=s.replace(old,new,1)
              old="  browserSnapshot, browserVideoDetails, youtubeChannelRoot,\n  enumerateCreatorVideos, readCreatorVideo,\n};\n"
              new="  browserSnapshot, browserVideoDetails, youtubeChannelRoot, youtubeChannelIdFromHtml, parseYouTubeFeedXml, youtubeFeedRefs,\n  enumerateCreatorVideos, readCreatorVideo,\n};\n"
              if old not in s: raise SystemExit('browser export marker missing')
              browser.write_text(s.replace(old,new,1))

          smoke=Path('scripts/creator-vault-live-smoke.js'); s=smoke.read_text()
          if 'let youtubeRefs = [];' not in s: s=s.replace('const results = [];','const results = [];\nlet youtubeRefs = [];')
          if 'youtubeRefs = refs;' not in s: s=s.replace("    const refs = await enumerateCreatorVideos(youtube, [], false, settings);\n", "    const refs = await enumerateCreatorVideos(youtube, [], false, settings);\n    youtubeRefs = refs;\n",1)
          old_start="  await probe('YouTube real recommendation extraction'"
          if old_start in s:
              start=s.index(old_start); end=s.index("\n\n  await probe('Modrinth exact resolver'",start)
              replacement=r'''  await probe('YouTube live recommendation extraction', async () => {
    assert(youtubeRefs.length > 0, 'YouTube enumeration did not supply candidates');
    const pattern=/\b(mods?|addons?|resource\s*packs?|texture\s*packs?|shaders?|datapacks?|plugins?)\b/i;
    const preferred=youtubeRefs.filter(ref=>pattern.test(String(ref.title||'')));
    const ordered=[...preferred,...youtubeRefs.filter(ref=>!preferred.includes(ref))],attempts=[];
    for(const ref of ordered.slice(0,10)){
      try{const details=await readCreatorVideo(youtube,ref);const projects=parseCreatorDescription({title:details.title||ref.title,text:details.description,platform:'youtube',links:details.links});attempts.push({id:ref.id,title:details.title||ref.title||'',projects:projects.length,source:details.source||ref.sourceTab||''});if(projects.length>=3)return{id:ref.id,title:details.title||ref.title||'',source:details.source||ref.sourceTab||'',projects:projects.length,firstProjects:projects.slice(0,3).map(project=>project.name),attempts:attempts.length};}catch(error){attempts.push({id:ref.id,title:ref.title||'',error:String(error?.message||error)});}
    }
    throw new Error(`no currently-live AsianHalfSquat recommendation yielded >=3 projects: ${JSON.stringify(attempts)}`);
  });'''
              s=s[:start]+replacement+s[end:]
          smoke.write_text(s)

          qa=Path('scripts/creator-vault-auto-ingestion-qa.js'); s=qa.read_text()
          if 'YouTube feed parser preserves recommendation descriptions' not in s:
              marker="check('YouTube initial player response parser preserves source description', () => {"
              insert=r'''check('YouTube feed parser preserves recommendation descriptions', () => {
  const browser=require('../src/creator-vault-auto/browser');
  const xml=`<feed><entry><yt:videoId>AbCdEfGhI12</yt:videoId><title>10 Minecraft Mods</title><published>2026-09-01T00:00:00+00:00</published><media:group><media:description><![CDATA[MOD DOWNLOADS:\nSodium https://modrinth.com/mod/sodium]]></media:description></media:group></entry></feed>`;
  const rows=browser.parseYouTubeFeedXml(xml);assert.strictEqual(rows.length,1);assert(rows[0].description.includes('Sodium'));
});
check('project URLs self-identify in recommendation descriptions', () => {
  const rows=parser.parseCreatorDescription({title:'Top Minecraft Mods',platform:'youtube',text:'Sodium https://modrinth.com/mod/sodium\nhttps://www.curseforge.com/minecraft/mc-mods/modernfix'});assert.strictEqual(rows.length,2);assert.strictEqual(rows[0].name,'Sodium');assert(/modernfix/i.test(rows[1].name));
});

'''
              if marker not in s: raise SystemExit('qa marker missing')
              s=s.replace(marker,insert+marker)
              qa.write_text(s)
          PY
          node --check src/creator-vault-auto/parser.js
          node --check src/creator-vault-auto/browser.js
          node --check scripts/creator-vault-live-smoke.js
          node --check scripts/creator-vault-auto-ingestion-qa.js
          node scripts/creator-vault-auto-ingestion-qa.js
          git diff --check
      - name: Repair Electron runtime and configure SUID sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron(){ node - <<'NODE'
          const fs=require('fs');try{const b=require('electron');if(typeof b==='string'&&fs.existsSync(b))process.stdout.write(b);else process.exit(1)}catch{process.exit(1)}
          NODE
          }
          install_electron(){ if [ -f node_modules/electron/install.js ]; then node node_modules/electron/install.js; else npm rebuild electron; fi; }
          ELECTRON_BIN="$(resolve_electron || true)"; if [ -z "$ELECTRON_BIN" ]; then install_electron; ELECTRON_BIN="$(resolve_electron)"; fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then rm -rf "$ELECTRON_DIR"; install_electron; ELECTRON_BIN="$(resolve_electron)"; ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"; SANDBOX="$ELECTRON_DIR/chrome-sandbox"; fi
          test -x "$ELECTRON_BIN"; test -f "$SANDBOX"; sudo chown root:root "$SANDBOX"; sudo chmod 4755 "$SANDBOX"; echo "ENDERLOOM_ELECTRON_BIN=$ELECTRON_BIN" >> "$GITHUB_ENV"
      - name: Real outbound smoke before source mutation
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 240s xvfb-run -a "$ENDERLOOM_ELECTRON_BIN" scripts/creator-vault-live-smoke.js 2>&1 | tee finalizer-live-smoke.log
      - name: Preserve failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-vault-finalizer-live-${{ github.run_id }}
          path: finalizer-live-smoke.log
          retention-days: 7
      - name: Commit only the live-proven source
        if: steps.live.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-creator-vault-live.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(creator-vault): finalize live automatic ingestion'
          git push origin HEAD:feature/creator-vault-auto-ingestion
      - name: Enforce live result
        if: steps.live.outcome == 'failure'
        run: exit 1
