name: Creator Vault Live Outbound Smoke

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion'
    paths:
      - 'scripts/creator-vault-live-smoke.js'
      - '.github/workflows/creator-vault-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENDERLOOM_DISABLE_CREATOR_AUTO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Repair Electron runtime if incomplete and configure SUID sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron() {
            node - <<'NODE'
          const fs = require('fs');
          try {
            const binary = require('electron');
            if (typeof binary === 'string' && fs.existsSync(binary)) process.stdout.write(binary);
            else process.exit(1);
          } catch {
            process.exit(1);
          }
          NODE
          }
          install_electron() {
            if [ -f node_modules/electron/install.js ]; then
              node node_modules/electron/install.js
            else
              npm rebuild electron
            fi
          }
          ELECTRON_BIN="$(resolve_electron || true)"
          if [ -z "$ELECTRON_BIN" ]; then
            echo 'Electron binary missing after npm ci; running the official Electron installer.'
            install_electron
            ELECTRON_BIN="$(resolve_electron)"
          fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"
          SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then
            echo 'Electron distribution is incomplete (chrome-sandbox missing); repairing the official dist once.'
            rm -rf "$ELECTRON_DIR"
            install_electron
            ELECTRON_BIN="$(resolve_electron)"
            ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"
            SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          fi
          if [ ! -x "$ELECTRON_BIN" ] || [ ! -f "$SANDBOX" ]; then
            echo '::error::Electron runtime is still incomplete after repair.'
            ls -la "$ELECTRON_DIR" || true
            exit 1
          fi
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          stat -c '%U:%G %a %n' "$SANDBOX"
          echo "ELECTRON_PATH=$ELECTRON_BIN" >> "$GITHUB_ENV"
          echo "ENDERLOOM_ELECTRON_BIN=$ELECTRON_BIN" >> "$GITHUB_ENV"
      - name: Exercise real YouTube, TikTok, and Modrinth paths
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          xvfb-run -a "$ENDERLOOM_ELECTRON_BIN" scripts/creator-vault-live-smoke.js 2>&1 | tee creator-vault-live-smoke.log
      - name: Preserve live smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-vault-live-smoke-${{ github.run_id }}
          path: creator-vault-live-smoke.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce live smoke result
        if: steps.smoke.outcome == 'failure'
        run: exit 1
