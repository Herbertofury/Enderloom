name: One-shot Electron DOM Pool Lifecycle Challenge

on:
  push:
    branches:
      - 'feature/creator-vault-auto-ingestion-hardening-stage3'
    paths:
      - '.github/workflows/one-shot-fix-dom-pool-lifecycle.yml'

permissions:
  contents: read

jobs:
  electron-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      ENDERLOOM_DISABLE_CREATOR_AUTO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-vault-auto-ingestion-hardening-stage3
          fetch-depth: 2
      - name: Verify repaired staging base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "08628f794e1bb85a8150b70051ceef375e4168ff"
          node --check main.js
          grep -q "Number(code)===-3" main.js
          grep -q "if(navigation){try{await navigation}catch{}}" main.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - name: Install and build the real launcher boundary
        run: |
          npm ci
          npm ci --prefix launcher
          npm run build:integration
          test -f launcher/dist/index.html
          test -x native/target/debug/enderloom-service
      - name: Repair Electron runtime and configure secure SUID sandbox
        shell: bash
        run: |
          set -euo pipefail
          resolve_electron() { node - <<'NODE'
          const fs=require('fs');try{const b=require('electron');if(typeof b==='string'&&fs.existsSync(b))process.stdout.write(b);else process.exit(1)}catch{process.exit(1)}
          NODE
          }
          install_electron(){ if [ -f node_modules/electron/install.js ]; then node node_modules/electron/install.js; else npm rebuild electron; fi; }
          ELECTRON_BIN="$(resolve_electron || true)"
          if [ -z "$ELECTRON_BIN" ]; then install_electron; ELECTRON_BIN="$(resolve_electron)"; fi
          ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"
          SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          if [ ! -f "$SANDBOX" ]; then
            rm -rf "$ELECTRON_DIR"
            install_electron
            ELECTRON_BIN="$(resolve_electron)"
            ELECTRON_DIR="$(dirname "$ELECTRON_BIN")"
            SANDBOX="$ELECTRON_DIR/chrome-sandbox"
          fi
          test -x "$ELECTRON_BIN"
          test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          echo "ELECTRON_PATH=$ELECTRON_BIN" >> "$GITHUB_ENV"
      - name: Run real Electron self-test and reject lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a npm run electron-self-test 2>&1 | tee electron-self-test.log
          grep -q 'CATALOG_COMPANION_SELF_TEST {"passed":true' electron-self-test.log
          if grep -q 'MaxListenersExceededWarning' electron-self-test.log; then
            echo '::error::WebContents listener leak still present.'
            exit 1
          fi
          if grep -q 'Live DOM hedge failed -3' electron-self-test.log; then
            echo '::error::Intentional ERR_ABORTED navigation was still misclassified.'
            exit 1
          fi
      - name: Preserve lifecycle challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-dom-pool-lifecycle-${{ github.sha }}
          path: electron-self-test.log
          if-no-files-found: warn
          retention-days: 14
