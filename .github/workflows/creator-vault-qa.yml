name: Creator Vault QA

on:
  push:
    branches:
      - 'feature/creator-vault-*-chunk-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: AsianHalfSquat chunk 15 post-merge stats
        run: >-
          node -e "const {loadCreatorVault}=require('./src/creator-vault');const v=loadCreatorVault(process.cwd());const a=v.creators.find(c=>c.id==='youtube:asianhalfsquat');const videos=v.videos.filter(x=>x.creatorId===a.id);const mods=videos.flatMap(x=>x.mods);const raw=require('./catalog/creator-vault/recommendation-sources/asianhalfsquat.history-batch15.json');console.log(JSON.stringify({stats:v.stats,ahs:{coverage:a.coverage,videos:videos.length,mentions:mods.length,linkedMentions:mods.filter(m=>m.providerLinks.length).length,linkedCanonical:new Set(mods.filter(m=>m.providerLinks.length).map(m=>m.canonicalProjectId)).size},unresolved:v.projects.filter(p=>!p.providerLinks.length).map(p=>p.name),sourceLevelUnresolved:(raw.videos||[]).flatMap(x=>x.unresolvedLinkedEvidence||[])},null,2))"
      - name: Missing timestamp regression QA
        run: node scripts/creator-vault-timestamp-qa.js
      - name: Catalog regression QA
        run: npm run catalog-qa
      - name: Render portable catalogs
        run: npm run portable
