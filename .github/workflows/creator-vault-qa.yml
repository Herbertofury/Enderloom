name: Creator Vault QA

on:
  push:
    branches:
      - 'feature/creator-vault-*-chunk-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: One-shot raw description probe for hidden structure links
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import html, json, re, urllib.request
          url='https://www.youtube.com/watch?v=8fwC4CzRDmE&hl=en'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
              raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              print('AHS13_RAW_HTTP_OK bytes='+str(len(raw)))
              m=re.search(r'"shortDescription":"((?:\\.|[^"\\])*)"',raw)
              if not m:
                  print('AHS13_RAW_NO_SHORT_DESCRIPTION')
              else:
                  desc=json.loads('"'+m.group(1)+'"')
                  print('AHS13_RAW_DESCRIPTION_BEGIN')
                  print(desc)
                  print('AHS13_RAW_DESCRIPTION_END')
          except Exception as e:
              print('AHS13_RAW_FAIL '+type(e).__name__+': '+str(e))
          PY
          exit 0
      - name: AsianHalfSquat chunk 13 canonical probe
        run: node scripts/creator-vault-ahs13-canonical-probe.js
      - name: Missing timestamp regression QA
        run: node scripts/creator-vault-timestamp-qa.js
      - name: Focused Creator Vault QA
        run: npm run creator-vault-qa
      - name: Catalog regression QA
        run: npm run catalog-qa
      - name: Render portable catalogs
        run: npm run portable
