name: Creator Vault QA

on:
  push:
    branches:
      - 'feature/creator-vault-*-chunk-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: AsianHalfSquat late-2025 metadata probe
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check -q yt-dlp
          echo AHS_META_BEGIN
          for id in 6lZny5TJBV4 Z-k0lZfl5vI 8fwC4CzRDmE o9V0iP7rik4; do
            echo "AHS_VIDEO_BEGIN $id"
            yt-dlp --skip-download --no-playlist --print '%(id)s' --print '%(title)s' --print '%(upload_date)s' --print '%(description)s' "https://www.youtube.com/watch?v=$id"
            echo "AHS_VIDEO_STATUS=$? $id"
            echo "AHS_VIDEO_END $id"
          done
          echo AHS_META_END
          exit 0
      - name: Missing timestamp regression QA
        run: node scripts/creator-vault-timestamp-qa.js
      - name: Focused Creator Vault QA
        run: npm run creator-vault-qa
      - name: Catalog regression QA
        run: npm run catalog-qa
      - name: Render portable catalogs
        run: npm run portable
