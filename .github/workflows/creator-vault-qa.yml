name: Creator Vault QA

on:
  push:
    branches:
      - 'feature/creator-vault-*-chunk-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Chunk 31 staging and baseline gate
        run: node scripts/creator-vault-ahs31-provider-collision.js baseline
      - name: Chunk 31 provider candidate shape gate
        run: node scripts/creator-vault-ahs31-provider-collision.js shape
      - name: Existing iris card matches Iris lineage
        run: node scripts/creator-vault-ahs31-provider-collision.js identity:iris
      - name: Existing c2me card matches C2ME lineage
        if: always()
        run: node scripts/creator-vault-ahs31-provider-collision.js identity:c2me
      - name: Existing terra card matches Terra lineage
        if: always()
        run: node scripts/creator-vault-ahs31-provider-collision.js identity:terra
      - name: Existing terralith card matches Terralith lineage
        if: always()
        run: node scripts/creator-vault-ahs31-provider-collision.js identity:terralith
      - name: Chunk 31 provider URL collision gate
        if: always()
        run: node scripts/creator-vault-ahs31-provider-collision.js urls
      - name: Missing timestamp regression QA
        if: success()
        run: node scripts/creator-vault-timestamp-qa.js
      - name: Focused Creator Vault recursive QA
        if: success()
        run: npm run creator-vault-qa
      - name: Catalog regression QA
        if: success()
        run: npm run catalog-qa
      - name: Render portable catalogs
        if: success()
        run: npm run portable
