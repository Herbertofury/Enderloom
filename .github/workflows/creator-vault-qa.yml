name: Creator Vault QA

on:
  push:
    branches:
      - 'feature/creator-vault-*-chunk-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Creator Vault corpus stats
        run: >-
          node -e "const {loadCreatorVault}=require('./src/creator-vault');const v=loadCreatorVault(process.cwd());const e=v.creators.find(c=>c.id==='youtube:enderversemc');console.log(JSON.stringify({stats:v.stats,enderVerse:e&&e.coverage,diagnostics:v.diagnostics},null,2))"
      - name: Focused Creator Vault QA
        run: npm run creator-vault-qa
      - name: Catalog regression QA
        run: npm run catalog-qa
      - name: Render portable catalogs
        run: npm run portable
