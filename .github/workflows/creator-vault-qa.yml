name: Creator Vault QA

on:
  push:
    branches:
      - 'feature/creator-vault-*-chunk-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Chunk 32 canonical reuse probe
        run: node scripts/creator-vault-ahs32-canonical-probe.js
      - name: Chunk 32 staging and baseline gate
        run: node scripts/creator-vault-ahs32-provider-collision.js baseline
      - name: Chunk 32 provider candidate shape gate
        run: node scripts/creator-vault-ahs32-provider-collision.js shape
      - name: Existing infinity-cave card matches source lineage
        run: node scripts/creator-vault-ahs32-provider-collision.js identity:infinity-cave
      - name: Existing multi-mine card matches source lineage
        if: always()
        run: node scripts/creator-vault-ahs32-provider-collision.js identity:multi-mine
      - name: Existing thin-air card matches source lineage
        if: always()
        run: node scripts/creator-vault-ahs32-provider-collision.js identity:thin-air
      - name: Existing horse-combat-controls card matches source lineage
        if: always()
        run: node scripts/creator-vault-ahs32-provider-collision.js identity:horse-combat-controls
      - name: Existing grappling-hook-mod card matches source lineage
        if: always()
        run: node scripts/creator-vault-ahs32-provider-collision.js identity:grappling-hook-mod
      - name: Chunk 32 provider URL collision gate
        if: always()
        run: node scripts/creator-vault-ahs32-provider-collision.js urls
      - name: Chunk 31 post-merge diagnostic
        if: success()
        run: node scripts/creator-vault-ahs31-postmerge-diagnostic.js
      - name: Missing timestamp regression QA
        if: success()
        run: node scripts/creator-vault-timestamp-qa.js
      - name: Focused Creator Vault recursive QA
        if: success()
        run: npm run creator-vault-qa
      - name: Catalog regression QA
        if: success()
        run: npm run catalog-qa
      - name: Render portable catalogs
        if: success()
        run: npm run portable
