name: Creator Vault QA

on:
  push:
    branches:
      - 'feature/creator-vault-*-chunk-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: AsianHalfSquat older uploads enumeration
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check -q yt-dlp
          echo AHS14_UPLOADS_BEGIN
          yt-dlp --flat-playlist --playlist-start 21 --playlist-end 38 --print '%(playlist_index)s\t%(id)s\t%(title)s' 'https://www.youtube.com/playlist?list=UU0E_vIe1e1lVeojYOgVg_5Q'
          status=$?
          echo AHS14_UPLOADS_STATUS=$status
          echo AHS14_UPLOADS_END
          exit 0
      - name: Missing timestamp regression QA
        run: node scripts/creator-vault-timestamp-qa.js
      - name: Focused Creator Vault QA
        run: npm run creator-vault-qa
      - name: Catalog regression QA
        run: npm run catalog-qa
      - name: Render portable catalogs
        run: npm run portable
