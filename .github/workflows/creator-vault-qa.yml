name: Creator Vault QA

on:
  push:
    branches:
      - 'feature/creator-vault-*-chunk-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Missing timestamp regression QA
        run: node scripts/creator-vault-timestamp-qa.js
      - name: Episode 5 corpus stats
        run: >-
          node -e "const {loadCreatorVault}=require('./src/creator-vault');const v=loadCreatorVault(process.cwd());const e=v.creators.find(c=>c.id==='youtube:enderversemc');const ep=v.videos.find(x=>x.id==='youtube:GYz4LQcNZ7s');console.log(JSON.stringify({stats:v.stats,enderVerse:e&&e.coverage,unresolved:v.projects.filter(p=>!p.providerLinks.length).map(p=>({id:p.id,name:p.name})),episode5:ep&&ep.mods.map(m=>({name:m.name,id:m.canonicalProjectId,links:m.providerLinks.length,providers:m.providerLinks.map(x=>x.provider)}))},null,2))"
      - name: Focused Creator Vault QA
        run: npm run creator-vault-qa
      - name: Catalog regression QA
        run: npm run catalog-qa
      - name: Render portable catalogs
        run: npm run portable
