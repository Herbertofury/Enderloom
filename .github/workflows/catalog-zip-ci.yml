name: Catalog ZIP integrity

on:
  push:
    branches: [main]
    paths: ['src/zip-lite.js', 'src/ingest.js', 'scripts/zip-integrity-qa.js', 'scripts/fixtures/**', '.github/workflows/catalog-zip-ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/zip-lite.js', 'src/ingest.js', 'scripts/zip-integrity-qa.js', 'scripts/fixtures/**', '.github/workflows/catalog-zip-ci.yml']

permissions:
  contents: read

jobs:
  zip-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/zip-integrity-qa.js
